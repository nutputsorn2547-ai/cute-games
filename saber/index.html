<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: neon night stage, single dark look on purpose. Score/combo top-left, song picker card centred when not playing, YouTube player bottom-left */
:root{--bg:#1d1630;--card:#2a2142;--ink:#fbefff;--soft:#b9a7d6;--accent:#ff7eb6;--accent-deep:#ff4f9a;--good:#7ef0c8;--warn:#ffcc66;--line:#3d3160;
  --cyan:#6fe3ff;--font:"Mitr","Noto Sans Thai",system-ui,sans-serif;color-scheme:dark}
.combo{position:fixed;left:24px;top:96px;font-size:15px;color:var(--soft);pointer-events:none;font-variant-numeric:tabular-nums}
.combo b{font-size:26px;color:var(--warn);font-weight:600}
.picker{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 48px));background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -30px #000;z-index:6}
.picker h1{margin:0;font-size:28px;font-weight:600}
.picker p{margin:0;color:var(--soft);line-height:1.6;font-size:15px}
.picker label{font-size:13px;color:var(--soft)}
.picker input[type=url],.picker input[type=number]{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.picker .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.picker .row > *{flex:1;min-width:0}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;border:0;background:transparent;color:var(--soft);padding:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:14px;color:var(--warn);min-height:1.4em}
.yt{position:fixed;left:16px;bottom:16px;width:256px;height:144px;border-radius:12px;overflow:hidden;border:2px solid var(--line);z-index:3}
.yt iframe{width:100%;height:100%}
.res{flex-direction:column;text-align:center;gap:6px}
.rank{font-size:84px;font-weight:600;line-height:1;color:var(--accent)}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;margin:6px auto;text-align:left;font-variant-numeric:tabular-nums}
.taps{display:flex;gap:6px;justify-content:center}
.taps i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.taps i.on{background:var(--accent)}
</style>

<body>
<div class="hud"><span class="lbl">คะแนน</span><b id="score">0</b></div>
<div class="combo" id="comboBox">คอมโบ <b id="combo">0</b> · แม่น <span id="acc">–</span></div>
<div class="yt" id="ytBox" hidden><div id="yt"></div></div>

<div class="picker" id="picker">
  <h1>ดาบจังหวะน้องกล่อง</h1>
  <p>ฟันกล่องตามทิศลูกศรตอนมันลอยมาถึงเส้น เลือกเพลงได้ 3 แบบ</p>
  <label for="link">ลิงก์ YouTube หรือลิงก์ไฟล์เสียง (.mp3)</label>
  <div class="row"><input type="url" id="link" placeholder="https://www.youtube.com/watch?v=…"><button class="btn" id="useLink" style="flex:none">ใช้ลิงก์นี้</button></div>
  <div class="row">
    <button class="btn ghost filebtn">เลือกไฟล์เพลงในเครื่อง<input type="file" id="file" accept="audio/*"></button>
    <button class="btn ghost" id="demo">เพลงตัวอย่าง</button>
  </div>
  <div class="row">
    <div class="seg" id="level"><button data-l="0">ง่าย</button><button data-l="1" class="on">ปกติ</button><button data-l="2">ยาก</button></div>
    <div><label for="bpm">BPM (ถ้ารู้ · ใช้กับ YouTube)</label><input type="number" id="bpm" min="60" max="200" placeholder="ไม่ใส่ก็ได้"></div>
  </div>
  <div class="status" id="status"></div>
  <div class="taps" id="taps" hidden></div>
  <button class="btn" id="go" hidden>เริ่มเล่น</button>
</div>

<div class="overlay" id="result" hidden>
  <div class="card res">
    <p style="margin:0">จบเพลง!</p>
    <div class="rank" id="rank">S</div>
    <div class="stats" id="stats"></div>
    <div class="btns" style="justify-content:center"><button class="btn ghost" id="again">เล่นเพลงเดิม</button><button class="btn" id="pick">เลือกเพลงใหม่</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from '../lib/RoundedBoxGeometry.js';
import { setupShell, shellMarkup } from '../lib/shell.js?v=3';
import { analyzeBeats, makeNotes, demoTrack } from '../lib/beats.js?v=1';

shellMarkup({
  title: 'ดาบจังหวะน้องกล่อง',
  blurb: 'มือถือคือด้ามดาบ ฟันกล่องตามทิศลูกศรให้ตรงจังหวะเพลง',
  steps: ['จับมือถือเหมือนด้ามดาบ หัวเครื่องชี้จอ กด <b>ตั้งศูนย์</b>', 'เลือกเพลงบนคอม แล้วฟันตามลูกศร'],
});
const S = setupShell({ game: 'saber', minCutoff: 2.5, beta: 4 });
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

/* ================= scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.domElement.className = 'scene';
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1d1630'); scene.fog = new THREE.Fog('#1d1630', 18, 46);
const camera = new THREE.PerspectiveCamera(60, 1, .1, 100); camera.position.set(0, 1.55, 4.2); camera.lookAt(0, 1.3, -6);
scene.add(new THREE.HemisphereLight('#c9b8ff', '#2a1f45', 1.4));
const key = new THREE.DirectionalLight('#ffffff', 1.5); key.position.set(2, 6, 5); scene.add(key);
// floor grid + lanes
const grid = new THREE.GridHelper(80, 80, '#ff7eb6', '#4a3a78'); grid.position.set(0, 0, -30); scene.add(grid);
const floorMat = new THREE.MeshBasicMaterial({ color: '#2a1f45' });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 60), floorMat); floor.rotation.x = -Math.PI / 2; floor.position.set(0, -.01, -25); scene.add(floor);
const hitLine = new THREE.Mesh(new THREE.BoxGeometry(4.2, .03, .06), new THREE.MeshBasicMaterial({ color: '#6fe3ff' })); hitLine.position.set(0, .02, 0); scene.add(hitLine);
// stars
{
  const g = new THREE.BufferGeometry(), p = [];
  for (let i = 0; i < 500; i++) p.push(rand(-40, 40), rand(2, 30), rand(-60, -10));
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#ffe6ff', size: .12 })));
}
// side pillars that pulse with the beat
const pillars = [];
for (const s of [-1, 1]) for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(.4, 3 + i * .3, .4, 2, .1), new THREE.MeshStandardMaterial({ color: s < 0 ? '#ff7eb6' : '#6fe3ff', emissive: s < 0 ? '#ff4f9a' : '#3cc8ff', emissiveIntensity: .3 }));
  m.position.set(s * (4 + i * .6), 1.5, -6 - i * 6); scene.add(m); pillars.push(m);
}
// saber
const hilt = new THREE.Vector3(.55, .15, 2.7);
const blade = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, 1, 12), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
const glow = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, 1, 12), new THREE.MeshBasicMaterial({ color: '#ff7eb6', transparent: true, opacity: .45, blending: THREE.AdditiveBlending, depthWrite: false }));
const handleM = new THREE.Mesh(new THREE.CylinderGeometry(.07, .08, .5, 12), new THREE.MeshStandardMaterial({ color: '#c9b8ff', metalness: .5, roughness: .3 }));
scene.add(blade, glow, handleM);
const TRAIL = 14, trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(TRAIL * 2 * 3), 3));
const ti = []; for (let i = 0; i < TRAIL - 1; i++) { const a = i * 2; ti.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } trailGeo.setIndex(ti);
const trail = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({ color: '#ff9ccc', transparent: true, opacity: .22, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
trail.frustumCulled = false; scene.add(trail);
const trailPts = [];

/* ================= note blocks ================= */
const BOX = .8;
const boxGeo = new RoundedBoxGeometry(BOX, BOX, BOX, 3, .16);
const COLS = { down: '#ff8fbd', up: '#7fdcff', left: '#ffd36e', right: '#b49cff', any: '#8ff0c8' };
function faceTex(dir) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.strokeStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = g.lineJoin = 'round';
  g.save(); g.translate(64, 38);
  if (dir === 'any') { g.beginPath(); g.arc(0, 0, 13, 0, 6.3); g.fill(); }
  else { const r = { down: 0, up: Math.PI, left: Math.PI / 2, right: -Math.PI / 2 }[dir]; g.rotate(r); g.beginPath(); g.moveTo(-26, -12); g.lineTo(0, 14); g.lineTo(26, -12); g.stroke(); }
  g.restore();
  g.fillStyle = '#3b2a55'; g.beginPath(); g.arc(46, 82, 7, 0, 6.3); g.arc(82, 82, 7, 0, 6.3); g.fill();
  g.strokeStyle = '#3b2a55'; g.lineWidth = 5; g.beginPath(); g.arc(64, 90, 8, .2, Math.PI - .2); g.stroke();
  g.fillStyle = '#ff6fa888'; g.beginPath(); g.ellipse(32, 96, 8, 5, 0, 0, 6.3); g.ellipse(96, 96, 8, 5, 0, 0, 6.3); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const faceMats = Object.fromEntries(Object.keys(COLS).map(d => [d, new THREE.MeshBasicMaterial({ map: faceTex(d), transparent: true })]));
const bodyMats = Object.fromEntries(Object.entries(COLS).map(([d, c]) => [d, new THREE.MeshStandardMaterial({ color: c, roughness: .4, emissive: c, emissiveIntensity: .25 })]));
const faceGeo = new THREE.PlaneGeometry(BOX * .9, BOX * .9);
const DIRV = { down: [0, -1], up: [0, 1], left: [-1, 0], right: [1, 0] };

/* ================= song / timing ================= */
const TRAVEL = 1.7, SPEED = 24 / TRAVEL;
let mode = 'menu', source = null, songBuf = null, info = null, notes = [], level = 1, live = [], nextNote = 0;
let ac = null, src = null, t0 = 0, pausedAt = 0, yt = null, ytTime = { t: 0, at: 0 }, ytReady = false, taps = [];
let score = 0, combo = 0, maxCombo = 0, hits = 0, misses = 0, wrong = 0, accSum = 0;
function songTime() {
  if (source === 'yt') { if (!yt || !ytReady) return 0; const playing = yt.getPlayerState && yt.getPlayerState() === 1; return ytTime.t + (playing ? (performance.now() - ytTime.at) / 1000 : 0); }
  if (!ac) return 0;
  return mode === 'paused' ? pausedAt : ac.currentTime - t0;
}
function songDuration() { return source === 'yt' ? (yt && yt.getDuration ? yt.getDuration() : 0) : songBuf ? songBuf.duration : 0; }
const status = t => { $('status').textContent = t; };

$('level').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; level = +b.dataset.l; for (const x of $('level').children) x.classList.toggle('on', x === b); });

async function useBuffer(buf, label) {
  songBuf = buf; source = 'buffer'; status(`กำลังฟังจังหวะเพลง ${label}…`);
  try { info = await analyzeBeats(buf); }
  catch (e) { status('วิเคราะห์เพลงไม่สำเร็จ ลองไฟล์อื่น'); return; }
  notes = makeNotes(info, level);
  status(`${label} · ประมาณ ${Math.round(info.bpm)} BPM · ${notes.length} กล่อง`);
  $('go').hidden = false;
}
$('demo').onclick = async () => { ac = S.audio(); status('กำลังสร้างเพลงตัวอย่าง…'); const buf = await demoTrack(); useBuffer(buf, 'เพลงตัวอย่าง'); };
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; ac = S.audio();
  status('กำลังเปิดไฟล์…');
  try { const buf = await ac.decodeAudioData(await f.arrayBuffer()); useBuffer(buf, f.name.replace(/\.[^.]+$/, '')); }
  catch (err) { status('เปิดไฟล์เสียงนี้ไม่ได้ ลองไฟล์ .mp3 หรือ .m4a'); }
};
function ytId(u) { const m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m && m[1]; }
$('useLink').onclick = async () => {
  const u = $('link').value.trim(); if (!u) return; ac = S.audio();
  const id = ytId(u);
  if (id) return setupYouTube(id);
  status('กำลังดาวน์โหลดเสียงจากลิงก์…');
  try {
    const r = await fetch(u); if (!r.ok) throw 0;
    const buf = await ac.decodeAudioData(await r.arrayBuffer()); useBuffer(buf, 'เพลงจากลิงก์');
  } catch (e) { status('ลิงก์นี้ดึงเสียงมาไม่ได้ (เว็บต้นทางไม่อนุญาต) ลองลิงก์ YouTube หรือเลือกไฟล์ในเครื่องแทน'); }
};
function setupYouTube(id) {
  source = 'yt'; status('กำลังโหลด YouTube…'); $('ytBox').hidden = false;
  const make = () => {
    if (yt) { yt.loadVideoById(id); yt.pauseVideo(); return; }
    yt = new YT.Player('yt', { videoId: id, playerVars: { controls: 1, playsinline: 1, rel: 0 },
      events: { onReady: () => { ytReady = true; status('พร้อมแล้ว กด "เริ่มเล่น" แล้วแตะตามจังหวะ 8 ครั้ง (Space หรือปุ่มบนมือถือ)'); $('go').hidden = false; }, onError: () => status('วิดีโอนี้ฝังเล่นนอก YouTube ไม่ได้ ลองเพลงอื่น') } });
  };
  if (window.YT && YT.Player) make();
  else { window.onYouTubeIframeAPIReady = make; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s); }
}
setInterval(() => { if (yt && ytReady && yt.getCurrentTime) { const t = yt.getCurrentTime(); if (Math.abs(t - songTime()) > .06 || yt.getPlayerState() !== 1) ytTime = { t, at: performance.now() }; } }, 250);

function resetRun() {
  for (const n of live) scene.remove(n.mesh); live = []; nextNote = 0;
  score = 0; combo = 0; maxCombo = 0; hits = 0; misses = 0; wrong = 0; accSum = 0; updHud();
}
function start() {
  resetRun(); $('picker').hidden = true; $('result').hidden = true;
  if (source === 'yt') {
    notes = []; taps = []; mode = 'tap'; $('taps').hidden = false;
    yt.seekTo(0); yt.playVideo(); S.big('แตะตามจังหวะ 8 ครั้ง', 2.5);
  } else {
    ac = S.audio(); if (ac.state === 'suspended') ac.resume();
    src = ac.createBufferSource(); src.buffer = songBuf; src.connect(ac.destination);
    t0 = ac.currentTime + .15; src.start(t0); mode = 'play';
    src.onended = () => { if (mode === 'play') finish(); };
  }
}
$('go').onclick = start;
$('again').onclick = () => { if (source === 'buffer') notes = makeNotes(info, level); start(); };
$('pick').onclick = () => { $('result').hidden = true; $('picker').hidden = false; mode = 'menu'; };
function togglePause() {
  if (mode === 'play') { mode = 'paused'; if (source === 'yt') yt.pauseVideo(); else { pausedAt = songTime(); ac.suspend(); } S.big('พัก'); }
  else if (mode === 'paused') { if (source === 'yt') yt.playVideo(); else ac.resume(); mode = 'play'; }
}
function beatTap() {
  const t = songTime(); taps.push(t); S.tone(1200, 1200, .05, .08, 'square'); S.vib(20);
  $('taps').innerHTML = Array.from({ length: 8 }, (_, i) => `<i class="${i < taps.length ? 'on' : ''}"></i>`).join('');
  if (taps.length >= 8) {
    // least-squares fit: tap k at offset + k*period
    const n = taps.length, ks = taps.map((_, i) => i);
    const mk = ks.reduce((a, b) => a + b) / n, mt = taps.reduce((a, b) => a + b) / n;
    let num = 0, den = 0; for (let i = 0; i < n; i++) { num += (ks[i] - mk) * (taps[i] - mt); den += (ks[i] - mk) ** 2; }
    let period = num / den; const manual = +$('bpm').value; if (manual >= 60 && manual <= 200) period = 60 / manual;
    const offset = mt - mk * period;
    info = { period, offset, bpm: 60 / period, duration: songDuration() };
    notes = makeNotes(info, level, t + TRAVEL + .6);
    nextNote = 0; mode = 'play'; $('taps').hidden = true;
    S.big(`${Math.round(60 / period)} BPM · ลุย!`, 1.6);
  }
}

/* ================= hit logic ================= */
const slices = [];
function sliceFx(n, vx, vy) {
  const m = n.mesh, perp = new THREE.Vector3(-vy, vx, 0).normalize();
  for (const s of [-1, 1]) {
    const half = new THREE.Mesh(new THREE.BoxGeometry(BOX, BOX, BOX / 2), bodyMats[n.dir]);
    half.position.copy(m.position); half.scale.set(1, 1, 1);
    half.userData = { v: perp.clone().multiplyScalar(s * 3).add(new THREE.Vector3(vx * .3, vy * .3 + 1, -2)), w: new THREE.Vector3(rand(-6, 6), rand(-6, 6), rand(-6, 6)), life: 1 };
    scene.add(half); slices.push(half);
  }
  for (let i = 0; i < 14; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 4), new THREE.MeshBasicMaterial({ color: COLS[n.dir] }));
    p.position.copy(m.position); p.userData = { v: new THREE.Vector3(rand(-4, 4), rand(-1, 5), rand(-3, 2)), w: new THREE.Vector3(), life: 1 }; scene.add(p); slices.push(p);
  }
}
function updHud() {
  $('score').textContent = score; $('combo').textContent = combo;
  const tot = hits + misses + wrong; $('acc').textContent = tot ? Math.round(hits / tot * 100) + '%' : '–';
}
function finish() {
  mode = 'done';
  const tot = hits + misses + wrong, pct = tot ? hits / tot : 0;
  const rank = pct > .95 ? 'S' : pct > .85 ? 'A' : pct > .7 ? 'B' : pct > .5 ? 'C' : 'D';
  $('rank').textContent = rank;
  $('stats').innerHTML = `<span>คะแนน</span><b>${score}</b><span>ฟันโดน</span><b>${hits}/${tot}</b><span>ผิดทาง</span><b>${wrong}</b><span>คอมโบสูงสุด</span><b>${maxCombo}</b>`;
  $('result').hidden = false; S.jingle(); S.vib([50, 50, 50, 50, 200]);
  if (source === 'yt' && yt) yt.pauseVideo();
}

/* ================= input ================= */
let mouse = { x: 0, y: 0, t: -1e9 };
addEventListener('mousemove', e => { mouse = { x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight * 2 - 1), t: performance.now() }; });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); if (mode === 'tap') beatTap(); else togglePause(); }
});
const tip = new THREE.Vector3(0, 1.3, 0), prevTip = tip.clone();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), ray = new THREE.Raycaster();
function aimTip() {
  if (S.pad.live) {
    const a = S.pad.raw, sm = S.pad.aim();
    // mostly raw (fast) with a touch of the smoothed value to hide sensor fuzz
    const yaw = a.yaw * .75 + sm.yaw * .25, pitch = a.pitch * .75 + sm.pitch * .25;
    return new THREE.Vector3(clamp(yaw / .42, -1.5, 1.5) * 1.7, 1.3 + clamp(pitch / .32, -1.5, 1.5) * 1.05, 0);
  }
  ray.setFromCamera(new THREE.Vector2(mouse.x, mouse.y), camera); const p = new THREE.Vector3(); ray.ray.intersectPlane(plane, p); return p || tip.clone();
}
function segHitsBox(a, b, cx, cy, h) {
  for (let i = 0; i <= 10; i++) { const x = a.x + (b.x - a.x) * i / 10, y = a.y + (b.y - a.y) * i / 10; if (Math.abs(x - cx) < h && Math.abs(y - cy) < h) return true; }
  return false;
}

/* ================= loop ================= */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  S.tick(dt);
  if (S.pad.tap('start')) { if (mode === 'tap') beatTap(); else if (mode === 'play' || mode === 'paused') togglePause(); else if ((mode === 'menu' || mode === 'done') && !$('go').hidden && source !== 'yt') start(); }

  prevTip.copy(tip);
  const tgt = aimTip(); tip.lerp(tgt, S.pad.live ? .85 : .6);
  const v = new THREE.Vector3().subVectors(tip, prevTip).divideScalar(Math.max(dt, 1e-3)), spd = Math.hypot(v.x, v.y);
  // blade from hilt to a bit past the tip
  const dir = new THREE.Vector3().subVectors(tip, hilt), len = dir.length() + .5; dir.normalize();
  const mid = hilt.clone().addScaledVector(dir, len / 2);
  for (const m of [blade, glow]) { m.position.copy(mid); m.scale.set(1, len, 1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); }
  glow.material.opacity = .35 + Math.min(.4, spd / 30);
  handleM.position.copy(hilt).addScaledVector(dir, -.2); handleM.quaternion.copy(blade.quaternion);
  trailPts.unshift(tip.clone()); if (trailPts.length > TRAIL) trailPts.pop();
  const tp = trailGeo.attributes.position;
  for (let i = 0; i < TRAIL; i++) { const p = trailPts[Math.min(i, trailPts.length - 1)]; const q = p.clone().lerp(hilt, .16); tp.setXYZ(i * 2, p.x, p.y, p.z); tp.setXYZ(i * 2 + 1, q.x, q.y, q.z); }
  tp.needsUpdate = true;

  const st = songTime();
  // beat pulse
  if (info && info.period) {
    const ph = ((st - info.offset) / info.period) % 1, pulse = Math.max(0, 1 - (ph < 0 ? ph + 1 : ph) * 4);
    for (const p of pillars) p.material.emissiveIntensity = .3 + pulse * .9;
    hitLine.scale.y = 1 + pulse * 3;
  }
  if (mode === 'play') {
    // spawn
    while (nextNote < notes.length && notes[nextNote].t - st < TRAVEL) {
      const n = notes[nextNote++], m = new THREE.Mesh(boxGeo, bodyMats[n.dir]);
      const f = new THREE.Mesh(faceGeo, faceMats[n.dir]); f.position.z = BOX / 2 + .01; m.add(f);
      scene.add(m); live.push({ ...n, mesh: m, x: (n.col - 1) * 1.15, y: .85 + n.row * 1.05, done: false });
    }
    for (const n of live) {
      const z = -(n.t - st) * SPEED;
      n.mesh.position.set(n.x, n.y + Math.sin(time * 4 + n.t) * .04, z);
      n.mesh.rotation.z = Math.sin(time * 3 + n.t) * .06;
      if (n.done) continue;
      if (z > -1.4 && z < 1.0 && spd > 2.2 && segHitsBox(prevTip, tip, n.x, n.y, BOX * .62)) {
        n.done = true; scene.remove(n.mesh); sliceFx(n, v.x, v.y);
        const ok = n.dir === 'any' ? 1 : (v.x * DIRV[n.dir][0] + v.y * DIRV[n.dir][1]) / spd;
        if (ok > .35) {
          hits++; combo++; maxCombo = Math.max(maxCombo, combo); accSum += ok;
          const timing = 1 - Math.min(1, Math.abs(z) / 1.2), mult = Math.min(8, 1 + Math.floor(combo / 8));
          score += Math.round((60 + 25 * ok + 15 * timing) * mult);
          S.tone(880 + Math.min(combo, 20) * 20, 1320, .06, .06, 'triangle'); S.noise(.06, 5000, .15, 'highpass'); S.vib(22);
        } else { wrong++; combo = 0; S.tone(220, 160, .1, .08, 'square'); S.vib([10, 30, 10]); S.big('ผิดทาง', .5, '#ffcc66'); }
        updHud();
      } else if (z > 1.4) { n.done = true; misses++; combo = 0; updHud(); }
    }
    for (let i = live.length - 1; i >= 0; i--) if (live[i].done && (live[i].mesh.parent === null || live[i].mesh.position.z > 4)) { scene.remove(live[i].mesh); live.splice(i, 1); }
    const dur = songDuration();
    if (source === 'yt' && dur && st > dur - .3) finish();
    if (source === 'yt' && nextNote >= notes.length && !live.length && notes.length && st > notes[notes.length - 1].t + 2) finish();
  }
  for (const s of slices) { s.userData.v.y -= 9 * dt; s.position.addScaledVector(s.userData.v, dt); s.rotation.x += s.userData.w.x * dt; s.rotation.y += s.userData.w.y * dt; s.userData.life -= dt * 1.4; s.scale.setScalar(Math.max(.01, s.userData.life)); }
  for (let i = slices.length - 1; i >= 0; i--) if (slices[i].userData.life <= 0) { scene.remove(slices[i]); slices.splice(i, 1); }

  const P = S.pad.live;
  if (S.pairing() || !$('result').hidden) S.hint('');
  else if (mode === 'menu') S.hint(P ? 'มือถือพร้อมแล้ว เลือกเพลงบนคอมได้เลย' : 'เลือกเพลง หรือกดต่อมือถือที่มุมขวาบน');
  else if (mode === 'tap') S.hint(`แตะตามจังหวะเพลง (Space หรือปุ่มบนมือถือ) ${taps.length}/8`);
  else if (mode === 'play') S.hint(P ? 'ฟันตามทิศลูกศรตอนกล่องถึงเส้นฟ้า' : 'ลากเมาส์ผ่านกล่องตามทิศลูกศร');
  else if (mode === 'paused') S.hint('พักอยู่ · กด Space หรือปุ่มบนมือถือเพื่อเล่นต่อ');
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__saber = { feed: d => S.pad.feed(d), get mode() { return mode; }, get stats() { return { score, hits, misses, wrong, combo, notes: notes.length, bpm: info && info.bpm, offset: info && info.offset }; }, demo: () => $('demo').onclick(), start };
requestAnimationFrame(frame);
</script>
</body>
