<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>จอยมือถือ · Cute Games</title>
<meta name="theme-color" content="#fff4ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap">
<style>
/* Layout: phone held flat like a remote — status strip, one-line hint, a huge hold button under the thumb, small row of helpers */
:root{--bg:#fff4ec;--card:#ffffff;--ink:#4a3a44;--soft:#9a8590;--pink:#ff8fab;--pink-deep:#e8678a;--mint:#7fd8be;--line:#f1dcd3;--warn:#e98a3a;
  --font:"Mitr","Noto Sans Thai",system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--mint)}
.soft{color:var(--soft)}
h1{margin:0;font-size:22px;font-weight:600}
.hint{margin:0;font-size:15px;line-height:1.55;color:var(--soft)}
.hint b{color:var(--ink);font-weight:500}
.warn{margin:0;font-size:14px;line-height:1.5;color:var(--warn)}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 8px;font-size:16px;flex:1}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button.on{background:var(--line)}
.big{flex:1;min-height:180px;border:0;border-radius:32px;color:#fff;font-size:30px;font-weight:600;
  background:linear-gradient(180deg,var(--pink),var(--pink-deep));box-shadow:0 10px 0 #c9557a,0 18px 30px -10px #e8678a88;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .06s,box-shadow .06s}
.big small{font-size:14px;font-weight:400;opacity:.9;max-width:26ch;line-height:1.4}
.big.on{transform:translateY(8px);box-shadow:0 2px 0 #c9557a,0 6px 16px -8px #e8678a88}
.look{height:96px;border:2px dashed var(--line);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;font-size:14px;color:var(--soft);background:var(--card);touch-action:none}
.look.on{border-color:var(--pink);color:var(--ink)}
.meter{display:flex;flex-direction:column;gap:6px;font-size:13px}
.mbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--mint);border-radius:7px;transition:width .1s}
.mbar i.hot{background:var(--pink-deep)}
.reelwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.reel{position:relative;width:min(72vw,40vh);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,var(--card) 34%,var(--line) 35%,var(--line) 37%,var(--card) 38%);
  border:3px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--soft);touch-action:none;padding:0 22%;box-sizing:border-box}
.reel.on{border-color:var(--pink)}
.knob{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.knob::after{content:"";position:absolute;top:6%;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--pink);box-shadow:0 4px 0 var(--pink-deep)}
.banner{border-radius:16px;padding:10px 14px;font-weight:500;font-size:17px;background:var(--card);border:3px solid var(--pc,var(--pink));display:flex;align-items:center;gap:10px}
.banner::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--pc,var(--pink));flex:none}
body.waiting #controls > *{opacity:.4;pointer-events:none}
.join{display:flex;flex-direction:column;gap:12px;margin:auto 0}
.join input{font:inherit;font-size:28px;text-align:center;letter-spacing:.3em;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card);color:var(--ink);text-transform:lowercase}
.join button{background:var(--pink);color:#fff;border:0}
</style>
</head>
<body>
  <div class="join" id="joinBox" hidden>
    <h1>ต่อจอยกับคอม</h1>
    <p class="hint">พิมพ์รหัส 5 ตัวที่ขึ้นบนจอคอม</p>
    <label for="code" class="soft" style="font-size:13px">รหัสห้อง</label>
    <input id="code" maxlength="5" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
    <button id="joinBtn">เชื่อมต่อ</button>
  </div>

  <div id="padBox" hidden style="display:contents">
    <div class="top">
      <span class="chip"><span class="dot" id="dot"></span><span id="conn">กำลังเชื่อมต่อ…</span></span>
      <span class="soft" id="room"></span>
    </div>
    <h1 id="title"></h1>
    <div class="banner" id="banner" hidden></div>
    <p class="hint" id="hint"></p>
    <p class="warn" id="warn" hidden></p>
    <button id="perm" hidden>แตะเพื่อเปิดเซ็นเซอร์หมุน</button>
    <div id="controls" style="display:contents"></div>
  </div>

<script type="module">
import { joinRoom } from './lib/link.js?v=3';
import { eulerToQuat } from './lib/aim.js?v=2';

const $ = id => document.getElementById(id);
const GAMES = {
  jenga: {
    title: 'จังก้า',
    hint: 'ถือมือถือ<b>หงายจอขึ้น</b> ให้<b>หัวเครื่องชี้ไปที่จอคอม</b> (หรือถือตั้งเหมือนถ่ายรูปก็ได้) กดตั้งศูนย์ทุกครั้งที่เปลี่ยนท่าถือ เล็งไม้ที่อยากดึง แล้วกดค้าง<b>จับ</b> จากนั้น<b>เงยหัวเครื่องขึ้นช้าๆ</b> เพื่อดึงไม้ออก',
    big: { id: 'grab', label: 'จับ · ดึง', sub: 'กดค้างไว้ · เงยหัวเครื่อง = ดึงออก · ปล่อยนิ้ว = วางไม้' },
    look: 'ลากนิ้วตรงนี้เพื่อหมุนดูรอบตึก 360° · ลากขึ้นลงเพื่อมองจากบน',
    row: [{ id: 'rotL', label: '◀ หมุน', hold: true }, { id: 'recal', label: 'ตั้งศูนย์' }, { id: 'rotR', label: 'หมุน ▶', hold: true }],
  },
  fishing: {
    title: 'ตกปลา',
    hint: 'ถือมือถือ<b>หงายจอ</b> หัวเครื่องชี้จอคอมเหมือนถือคันเบ็ด <b>เงยขึ้นแล้วสะบัดลงเร็วๆ</b> เพื่อเหวี่ยงเบ็ด ปลากินเหยื่อเมื่อไหร่ <b>กระตุกขึ้นเร็วๆ</b> แล้ว<b>หมุนนิ้ววนรอบรอก</b>เพื่อกรอสาย',
    meter: true,
    reel: 'หมุนนิ้ววนตามเข็มนาฬิกาเพื่อกรอสาย',
    row: [{ id: 'cast', label: 'เหวี่ยง (ค้าง/ปล่อย)', hold: true }, { id: 'strike', label: 'ตวัด!' }, { id: 'recal', label: 'ตั้งศูนย์' }],
  },
  cooking: {
    title: 'ครัวน่ารัก',
    hint: 'ถือมือถือ<b>หงายจอ</b> หัวเครื่องชี้จอคอม · <b>สะบัดลงเร็วๆ</b> = สับ/ทุบ · <b>หันซ้ายขวา</b> = เลื่อนมีด · ตอนคนหม้อ <b>วนมือถือเป็นวงกลม</b>',
    big: { id: 'act', label: 'สับ! / ทุบ!', sub: 'แตะแทนการสะบัดได้', tap: true },
    row: [{ id: 'recal', label: 'ตั้งศูนย์' }, { id: 'next', label: 'ต่อไป ▶' }],
  },
  latte: {
    title: 'ลาเต้อาร์ต',
    hint: 'ถือมือถือ<b>หงายจอ</b> เหมือนถือเหยือกนม · <b>หัน/ก้ม/เงย</b> = เลื่อนตำแหน่งเท · <b>เอียงข้าง (บิดข้อมือ)</b> หรือกดค้างปุ่ม = เทนม · ส่ายเบาๆ ตอนเทจะได้ลาย',
    big: { id: 'pour', label: 'เทนม', sub: 'กดค้างไว้ · หรือบิดข้อมือเอียงมือถือ' },
    row: [{ id: 'recal', label: 'ตั้งศูนย์' }, { id: 'newcup', label: 'แก้วใหม่' }, { id: 'next', label: 'ลายถัดไป' }],
  },
  saber: {
    title: 'ดาบจังหวะ',
    hint: 'จับมือถือเหมือน<b>ด้ามดาบ</b> หัวเครื่องชี้ไปที่จอ กดตั้งศูนย์ แล้ว<b>ฟันตามทิศลูกศร</b>บนกล่องตอนที่มันลอยมาถึง',
    big: { id: 'start', label: 'เริ่ม / พัก', sub: 'มือถือจะสั่นทุกครั้งที่ฟันโดน', tap: true },
    row: [{ id: 'recal', label: 'ตั้งศูนย์' }],
  },
};

const params = new URLSearchParams(location.search);
let room = (params.get('room') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const game = GAMES[params.get('game')] ? params.get('game') : 'jenga';

if (!room) {
  $('joinBox').hidden = false;
  $('joinBtn').onclick = () => {
    const c = $('code').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (c.length === 5) location.search = `?room=${c}&game=${game}`;
  };
} else start();

function start() {
  $('padBox').hidden = false;
  const cfg = GAMES[game];
  $('title').textContent = cfg.title;
  $('hint').innerHTML = cfg.hint;
  $('room').textContent = 'ห้อง ' + room;

  const st = { q: [1, 0, 0, 0], b: {}, taps: {}, look: [0, 0], reel: 0 };
  let tension = 0;
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // build controls
  const ctr = $('controls');
  let big = null;
  if (cfg.big) {
    big = document.createElement('button');
    big.className = 'big'; big.id = cfg.big.id;
    big.innerHTML = `<span>${cfg.big.label}</span><small>${cfg.big.sub}</small>`;
  }
  if (cfg.meter) {
    const m = document.createElement('div'); m.className = 'meter';
    m.innerHTML = '<span class="soft">แรงตึงสาย</span><div class="mbar"><i id="mfill"></i></div>';
    ctr.append(m);
  }
  if (cfg.reel) {
    const wrap = document.createElement('div'); wrap.className = 'reelwrap';
    const r = document.createElement('div'); r.className = 'reel'; r.innerHTML = `<div class="knob" id="knob"></div><span>${cfg.reel}</span>`;
    wrap.append(r); ctr.append(wrap);
    let lastA = null, spin = 0;
    const ang = e => { const b = r.getBoundingClientRect(); return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)); };
    r.addEventListener('pointerdown', e => { e.preventDefault(); r.setPointerCapture(e.pointerId); lastA = ang(e); r.classList.add('on'); });
    r.addEventListener('pointermove', e => {
      if (lastA === null) return;
      const a = ang(e); let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
      lastA = a; st.reel += d; spin += d;
      $('knob').style.transform = `rotate(${spin}rad)`;
    });
    const end = () => { lastA = null; r.classList.remove('on'); };
    r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
  }
  const row = document.createElement('div'); row.className = 'row';
  for (const r of cfg.row) { const b = document.createElement('button'); b.id = r.id; b.textContent = r.label; b.dataset.hold = r.hold ? '1' : ''; row.append(b); }
  if (cfg.look) {
    const lp = document.createElement('div'); lp.className = 'look'; lp.textContent = cfg.look;
    let lastP = null;
    lp.addEventListener('pointerdown', e => { e.preventDefault(); lp.setPointerCapture(e.pointerId); lastP = [e.clientX, e.clientY]; lp.classList.add('on'); });
    lp.addEventListener('pointermove', e => { if (!lastP) return; st.look[0] += e.clientX - lastP[0]; st.look[1] += e.clientY - lastP[1]; lastP = [e.clientX, e.clientY]; });
    const end = () => { lastP = null; lp.classList.remove('on'); };
    lp.addEventListener('pointerup', end); lp.addEventListener('pointercancel', end);
    ctr.append(lp);
  }
  if (big) ctr.append(big);
  ctr.append(row);
  const wireHold = (el, id) => {
    st.b[id] = false;
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); st.b[id] = true; el.classList.add('on'); vib(15); push(); });
    const up = () => { st.b[id] = false; el.classList.remove('on'); push(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  };
  if (big && cfg.big.tap) { st.taps[cfg.big.id] = 0; big.addEventListener('pointerdown', e => { e.preventDefault(); st.taps[cfg.big.id]++; big.classList.add('on'); vib(20); push(); }); const off = () => big.classList.remove('on'); big.addEventListener('pointerup', off); big.addEventListener('pointercancel', off); }
  else if (big) wireHold(big, cfg.big.id);
  for (const r of cfg.row) {
    const el = $(r.id);
    if (r.hold) wireHold(el, r.id);
    else { st.taps[r.id] = 0; el.addEventListener('click', () => { st.taps[r.id]++; vib(25); push(); }); }
  }

  // sensors
  let gotSensor = false;
  addEventListener('deviceorientation', e => {
    if (e.beta == null) return;
    gotSensor = true; $('warn').hidden = true;
    st.q = eulerToQuat(e.alpha || 0, e.beta, e.gamma);
  });
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    $('perm').hidden = false;
    $('perm').onclick = async () => { try { await DeviceOrientationEvent.requestPermission(); } catch (e) {} $('perm').hidden = true; };
  }
  setTimeout(() => {
    if (gotSensor) return;
    $('warn').textContent = window.isSecureContext ? 'ยังไม่ได้รับค่าเซ็นเซอร์หมุน ลองขยับมือถือ หรือเปิดด้วย Chrome' : 'ต้องเปิดผ่านลิงก์ https เท่านั้นถึงจะอ่านเซ็นเซอร์ได้';
    $('warn').hidden = false;
  }, 2500);

  // link
  const labels = { connecting: 'กำลังเชื่อมต่อ…', connected: 'เชื่อมกับคอมแล้ว', lost: 'หลุด กำลังต่อใหม่…', 'no-room': 'ไม่พบห้องนี้ เปิดเกมบนคอมไว้หรือยัง?', error: 'ต่อไม่ได้ กำลังลองใหม่…' };
  const link = joinRoom({
    code: room,
    onStatus: s => { $('conn').textContent = labels[s] || s; $('dot').classList.toggle('ok', s === 'connected'); if (s === 'connected') vib([30, 60, 30]); },
    onData: d => {
      if (!d) return;
      if (d.vib) vib(d.vib);
      if (d.you) {
        const b = $('banner'); b.hidden = false; b.style.setProperty('--pc', d.color || '');
        b.textContent = d.turn ? (d.waitingFor ? `ตาของคุณ! (${d.you})` : d.you) : `รอตา ${d.waitingFor} · คุณคือ ${d.you}`;
        document.body.classList.toggle('waiting', !d.turn);
      }
      if (typeof d.ten === 'number') { tension = d.ten; const f = $('mfill'); if (f) { f.style.width = Math.min(100, tension * 100) + '%'; f.classList.toggle('hot', tension > .8); } }
    },
  });
  function push() { link.send(st); }
  // the line tugs back: buzz harder and longer as tension rises
  setInterval(() => { if (tension > 0.12) vib(Math.round(12 + Math.min(1, tension) * 110)); }, 170);
  setInterval(push, 16);

  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} });
}
</script>
</body>
</html>
