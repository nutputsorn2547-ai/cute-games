<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ปอกน้องมันฝรั่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap">
<style>
/* Layout: one potato held over a wooden bowl; peel meter + timer card top-centre, potato count top-left, hint bottom */
:root{--bg:#fdf1df;--card:#fffdf8;--ink:#4d3a2c;--soft:#9b8573;--accent:#f0a25a;--accent-deep:#d9803a;--good:#9ccf7c;--warn:#f2b24a;--line:#f1e0c8;
  --font:"Mitr","Noto Sans Thai",system-ui,sans-serif;color-scheme:light}
.meter{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 18px;display:flex;flex-direction:column;gap:6px;min-width:300px;text-align:center;box-shadow:0 10px 24px -16px #9a6a40}
.meter b{font-size:19px;font-weight:600}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.bar i{transition:width .15s}
.result{flex-direction:column;text-align:center;gap:8px}
.stars{font-size:52px;letter-spacing:.1em;color:var(--warn)}
.stars span{color:var(--line)}
.scores{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-variant-numeric:tabular-nums;text-align:left;margin:0 auto}
</style>
<link rel="stylesheet" href="../lib/shell.css">
<script type="importmap">{ "imports": { "three": "../lib/three.module.js" } }</script>
</head>
<body>
<div class="hud"><span class="lbl">ปอกเสร็จ</span><b id="count">0</b><span class="lbl" id="best"></span></div>
<div class="meter" id="meter" hidden>
  <b id="potName">น้องมันฝรั่ง</b>
  <div class="row"><span id="pctTxt">ปอกแล้ว 0%</span><span id="gougeTxt">แหว่ง 0/4</span><span id="timeTxt">60 วิ</span></div>
  <div class="bar"><i id="pctBar"></i></div>
</div>
<div class="overlay" id="result" hidden>
  <div class="card result">
    <p style="margin:0">หมดเวลา!</p>
    <h1 id="resTitle">ปอกได้ 0 หัว</h1>
    <div class="stars" id="stars"></div>
    <div class="scores" id="scores"></div>
    <div class="btns" style="justify-content:center;margin-top:8px"><button class="btn" id="again">ปอกอีกรอบ</button></div>
  </div>
</div>
<script src="../lib/qrcode.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from '../lib/RoundedBoxGeometry.js';
import { setupShell, shellMarkup } from '../lib/shell.js?v=3';

shellMarkup({
  title: 'ปอกน้องมันฝรั่ง',
  blurb: 'มือถือคือที่ปอก กดค้างแล้วลากผ่านผิวมันฝรั่ง ปอกให้เกลี้ยงก่อนหมดเวลา',
  steps: ['ถือหงายจอ หัวเครื่องชี้จอ กด <b>ตั้งศูนย์</b>', 'ชี้ไปที่มันฝรั่ง กดค้างปุ่ม <b>ปอก</b> แล้วลากลง · ลากนิ้วบนแผ่นหมุนเพื่อพลิกมันฝรั่ง'],
});
const S = setupShell({ game: 'peel' });
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

/* ================= scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.domElement.className = 'scene';
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#fbe9d2');
const camera = new THREE.PerspectiveCamera(38, 1, .1, 100);
camera.position.set(0, 3.2, 7.4); camera.lookAt(0, 1.55, 0);
scene.add(new THREE.HemisphereLight('#fffaf0', '#d9b48c', 1.5));
const sun = new THREE.DirectionalLight('#fff3e0', 2.2); sun.position.set(3, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); scene.add(sun);
const fill = new THREE.DirectionalLight('#ffe3f0', .6); fill.position.set(-5, 2, 3); scene.add(fill);
const M = c => new THREE.MeshStandardMaterial({ color: c, roughness: .7 });
const table = new THREE.Mesh(new RoundedBoxGeometry(14, 1, 8, 4, .2), M('#e8c094')); table.position.y = -.5; table.receiveShadow = true; scene.add(table);
const cloth = new THREE.Mesh(new THREE.CircleGeometry(2.6, 40), M('#cfe8d0')); cloth.rotation.x = -Math.PI / 2; cloth.position.set(0, .01, .4); scene.add(cloth);
// bowl for the peels
const bowl = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#ffb7c9', roughness: .5, side: THREE.DoubleSide }));
bowl.scale.y = .45; bowl.position.set(0, .68, .4); bowl.castShadow = true; scene.add(bowl);
const bowlRim = new THREE.Mesh(new THREE.TorusGeometry(1.5, .07, 8, 40), M('#ffffff')); bowlRim.rotation.x = Math.PI / 2; bowlRim.position.set(0, .68, .4); scene.add(bowlRim);
// peeled potatoes waiting on a plate (one added per finished potato)
const plate = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.1, .12, 36), M('#ffffff')); plate.position.set(3.1, .06, -1.2); plate.receiveShadow = true; scene.add(plate);
const done = [];

/* ================= the potato ================= */
const TW = 512, TH = 256, MW = 128, MH = 64;   // texture, and the coarser mask used for scoring
const skinCanvas = document.createElement('canvas'); skinCanvas.width = TW; skinCanvas.height = TH;
const sctx = skinCanvas.getContext('2d');
const skinTex = new THREE.CanvasTexture(skinCanvas); skinTex.colorSpace = THREE.SRGBColorSpace; skinTex.anisotropy = 4;
const mask = new Float32Array(MW * MH);             // 1 = skin left, 0 = peeled
const wRow = Float32Array.from({ length: MH }, (_, j) => Math.sin((j + .5) / MH * Math.PI)); // area weight per row
const wTotal = wRow.reduce((a, b) => a + b, 0) * MW;
const KINDS = [
  { name: 'น้องมันฝรั่งกลม', skin: '#b98552', spot: '#8a5d34', flesh: '#fff0b8', scale: [1.25, 1.0, 1.05], bump: .06 },
  { name: 'น้องมันยาว', skin: '#c49a63', spot: '#94683d', flesh: '#fff3c4', scale: [1.55, .92, .95], bump: .08 },
  { name: 'น้องมันม่วง', skin: '#7b4f86', spot: '#5c3767', flesh: '#e9d7ff', scale: [1.3, 1.02, 1.0], bump: .07 },
  { name: 'น้องมันแดง', skin: '#b35a4a', spot: '#8c3f33', flesh: '#fff3d9', scale: [1.2, 1.05, 1.1], bump: .05 },
];
let kind = KINDS[0], potato = null, face = null, skinLeft = 1;
const potGroup = new THREE.Group(); potGroup.position.set(0, 1.75, 0); scene.add(potGroup);

function paintSkin() {
  sctx.fillStyle = kind.skin; sctx.fillRect(0, 0, TW, TH);
  // freckles and a few "eyes"
  for (let i = 0; i < 260; i++) { sctx.fillStyle = Math.random() < .5 ? kind.spot + '55' : '#ffffff18'; sctx.beginPath(); sctx.arc(rand(0, TW), rand(8, TH - 8), rand(1, 3.5), 0, 6.3); sctx.fill(); }
  for (let i = 0; i < 7; i++) { sctx.fillStyle = kind.spot; sctx.beginPath(); sctx.ellipse(rand(0, TW), rand(40, TH - 40), rand(4, 7), rand(3, 5), rand(0, 3), 0, 6.3); sctx.fill(); }
  skinTex.needsUpdate = true;
  mask.fill(1);
}
function newPotato() {
  kind = KINDS[Math.floor(Math.random() * KINDS.length)];
  if (potato) { potGroup.remove(potato); potato.geometry.dispose(); }
  const g = new THREE.SphereGeometry(1, 96, 64), p = g.attributes.position;
  const seeds = Array.from({ length: 5 }, () => new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize());
  for (let i = 0; i < p.count; i++) {
    const v = new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i));
    let k = 1; for (const s of seeds) k += kind.bump * Math.exp(-v.distanceToSquared(s) * 3) * (s.x > 0 ? 1 : -.7);
    v.multiplyScalar(k);
    p.setXYZ(i, v.x * kind.scale[0], v.y * kind.scale[1], v.z * kind.scale[2]);
  }
  g.computeVertexNormals();
  potato = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: skinTex, roughness: .8 }));
  potato.castShadow = true; potGroup.add(potato);
  paintSkin(); skinLeft = 1; gouges = 0; scrapeAcc = 0; gougeCool = 0; ouchT = 0; warned = false; ruined = false;
  // cute face, stays on the front
  if (face) potGroup.remove(face);
  face = new THREE.Group();
  const eye = new THREE.MeshBasicMaterial({ color: '#3d2a20' }), blush = new THREE.MeshBasicMaterial({ color: '#ff9fb2' });
  const zf = kind.scale[2] + .02;
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.075, 12, 8), eye); e.position.set(s * .32, .18, zf); face.add(e); (face.userData.eyes ||= []).push(e);
    const b = new THREE.Mesh(new THREE.CircleGeometry(.09, 14), blush); b.position.set(s * .52, -.02, zf - .03); face.add(b);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.08, .022, 6, 14, Math.PI), eye); mouth.rotation.z = Math.PI; mouth.position.set(0, .02, zf); face.add(mouth); face.userData.mouth = mouth;
  potato.add(face);
  potato.rotation.set(0, 0, 0); spin.set(0, 0);
  potGroup.scale.setScalar(.01); popIn = 0;
  $('potName').textContent = kind.name;
}

/* ================= peeling ================= */
function peelAt(uv, strength) {
  // uv from the raycast; brush is wider in u near the poles so it stays round on the surface
  const theta = (1 - uv.y) * Math.PI, sinT = Math.max(.18, Math.sin(theta));
  const ry = 13 * strength, rx = ry / sinT;
  const cx = uv.x * TW, cy = (1 - uv.y) * TH;
  sctx.fillStyle = kind.flesh;
  for (const off of [-TW, 0, TW]) { sctx.beginPath(); sctx.ellipse(cx + off, cy, rx, ry, 0, 0, 6.3); sctx.fill(); }
  // a slightly darker rim so each stroke reads as a peeled strip
  sctx.strokeStyle = kind.skin + '55'; sctx.lineWidth = 1.2;
  sctx.beginPath(); sctx.ellipse(cx, cy, rx, ry, 0, 0, 6.3); sctx.stroke();
  skinTex.needsUpdate = true;
  // mask
  const mx = uv.x * MW, my = (1 - uv.y) * MH, mry = ry / TH * MH, mrx = rx / TW * MW;
  let removed = 0, cells = 0, bare = 0;
  for (let j = Math.max(0, Math.floor(my - mry)); j <= Math.min(MH - 1, Math.ceil(my + mry)); j++) {
    for (let di = Math.floor(-mrx); di <= Math.ceil(mrx); di++) {
      const dy = (j + .5 - my) / mry, dx = di / mrx; if (dx * dx + dy * dy > 1) continue;
      const i = ((Math.floor(mx) + di) % MW + MW) % MW, k = j * MW + i;
      cells++; if (mask[k] > 0) { removed += mask[k] * wRow[j]; mask[k] = 0; } else bare++;
    }
  }
  return { removed: removed / wTotal, over: cells ? bare / cells : 0 };
}
const strips = [];
const stripGeo = new THREE.TorusGeometry(.13, .035, 6, 14, Math.PI * 1.4);
function dropStrip(pos) {
  const m = new THREE.Mesh(stripGeo, new THREE.MeshStandardMaterial({ color: kind.skin, roughness: .8 }));
  m.position.copy(pos); m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
  m.userData = { v: new THREE.Vector3(rand(-.8, .8), rand(.5, 1.5), rand(.2, 1)), w: new THREE.Vector3(rand(-6, 6), rand(-6, 6), rand(-6, 6)), landed: false };
  m.castShadow = true; scene.add(m); strips.push(m);
  if (strips.length > 140) { const o = strips.shift(); scene.remove(o); }
}

/* ================= mistakes: the potato gets a chunk taken out ================= */
const MAX_GOUGE = 4, FAST = 9;      // FAST: surface speed (units/s) that digs in instead of peeling
let gouges = 0, scrapeAcc = 0, gougeCool = 0, ouchT = 0, warned = false, ruined = false, totalGouges = 0;
function gouge(hit, why) {
  if (ruined) return;
  gougeCool = .6; ouchT = .9; gouges++; totalGouges++;
  timeLeft = Math.max(0, timeLeft - 3);
  // dent the mesh around the contact point
  const g = potato.geometry, pos = g.attributes.position, nrm = g.attributes.normal;
  const local = potato.worldToLocal(hit.point.clone()), R = .34, depth = .17, v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i); const d = v.distanceTo(local); if (d >= R) continue;
    let k = 1 - d / R; k = k * k * (3 - 2 * k);
    n.fromBufferAttribute(nrm, i); v.addScaledVector(n, -depth * k); pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere();
  // paint a wet, darker crater so the bite shows
  const uv = hit.uv, theta = (1 - uv.y) * Math.PI, sinT = Math.max(.18, Math.sin(theta));
  const cx = uv.x * TW, cy = (1 - uv.y) * TH, ry = 24, rx = ry / sinT;
  for (const off of [-TW, 0, TW]) {
    const gr = sctx.createRadialGradient(cx + off, cy, 2, cx + off, cy, ry);
    gr.addColorStop(0, '#d9b98a'); gr.addColorStop(.7, kind.flesh); gr.addColorStop(1, kind.flesh + '00');
    sctx.save(); sctx.translate(cx + off, cy); sctx.scale(rx / ry, 1); sctx.translate(-(cx + off), -cy);
    sctx.fillStyle = gr; sctx.beginPath(); sctx.arc(cx + off, cy, ry, 0, 6.3); sctx.fill(); sctx.restore();
  }
  skinTex.needsUpdate = true;
  const mx = uv.x * MW, my = (1 - uv.y) * MH, mry = ry / TH * MH, mrx = rx / TW * MW;
  for (let j = Math.max(0, Math.floor(my - mry)); j <= Math.min(MH - 1, Math.ceil(my + mry)); j++)
    for (let di = Math.floor(-mrx); di <= Math.ceil(mrx); di++) {
      const dy = (j + .5 - my) / mry, dx = di / mrx; if (dx * dx + dy * dy > 1) continue;
      const k = j * MW + ((Math.floor(mx) + di) % MW + MW) % MW; if (mask[k] > 0) { skinLeft -= mask[k] * wRow[j] / wTotal; mask[k] = 0; }
    }
  // the chunk flies off
  for (let i = 0; i < 2; i++) {
    const c = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.1, .16), 0), new THREE.MeshStandardMaterial({ color: kind.flesh, roughness: .6 }));
    c.position.copy(hit.point); c.userData = { v: new THREE.Vector3(rand(-1.5, 1.5), rand(1.5, 3), rand(.5, 1.5)), w: new THREE.Vector3(rand(-8, 8), rand(-8, 8), rand(-8, 8)), landed: false };
    c.castShadow = true; scene.add(c); strips.push(c);
  }
  S.noise(.14, 700, .5); S.tone(520, 260, .18, .12, 'triangle'); S.vib([90, 40, 60]);
  if (gouges >= MAX_GOUGE) {
    ruined = true; S.big('น้องแหว่งเกินไปแล้ว!', 1.6, '#d9803a');
    setTimeout(() => { if (mode === 'play') newPotato(); }, 900);
  } else S.big(why === 'fast' ? 'แหว่ง! ขยับเร็วไป' : 'แหว่ง! ขูดซ้ำที่เดิม', 1.1, '#d9803a');
}

/* ================= peeler ================= */
const peeler = new THREE.Group();
{
  const handle = new THREE.Mesh(new RoundedBoxGeometry(.22, 1.1, .16, 3, .07), M('#7fd1c4')); handle.position.y = .75;
  const frame = new THREE.Mesh(new THREE.TorusGeometry(.22, .035, 8, 20, Math.PI), new THREE.MeshStandardMaterial({ color: '#dfe7ee', metalness: .5, roughness: .3 }));
  frame.rotation.z = Math.PI; frame.position.y = .2;
  const blade = new THREE.Mesh(new THREE.BoxGeometry(.42, .05, .03), new THREE.MeshStandardMaterial({ color: '#f5f8fb', metalness: .6, roughness: .2 })); blade.position.y = 0;
  peeler.add(handle, frame, blade); scene.add(peeler);
}

/* ================= game flow ================= */
const ROUND = 60;
let mode = 'menu', timeLeft = ROUND, count = 0, popIn = 1, totalPeeled = 0, combo = 0;
let best = 0; try { best = +localStorage.getItem('peelBest') || 0; } catch (e) {}
const showBest = () => { $('best').textContent = best ? `สถิติ ${best} หัว` : ''; }; showBest();
function start() {
  for (const d of done) scene.remove(d); done.length = 0;
  for (const s of strips) scene.remove(s); strips.length = 0;
  count = 0; totalPeeled = 0; totalGouges = 0; timeLeft = ROUND; $('count').textContent = 0;
  $('result').hidden = true; $('meter').hidden = false; mode = 'play';
  newPotato(); S.big('ปอกเลย!');
}
function finishPotato() {
  count++; $('count').textContent = count; totalPeeled++;
  timeLeft = Math.min(ROUND, timeLeft + 6);
  S.jingle(); S.vib([40, 40, 40, 40, 120]); S.big(['เกลี้ยงเลย!', 'เนียนกริบ!', 'มือโปร!', 'น่ากินมาก!'][count % 4]);
  // the peeled potato hops onto the plate
  const m = potato.clone(); m.material = new THREE.MeshStandardMaterial({ color: kind.flesh, roughness: .5 });
  m.scale.setScalar(.45); m.position.set(3.1 + rand(-.6, .6), .55 + done.length * .05, -1.2 + rand(-.4, .4)); m.rotation.y = rand(0, 6);
  scene.add(m); done.push(m);
  newPotato();
}
function endRound() {
  mode = 'done'; $('meter').hidden = true;
  if (count > best) { best = count; try { localStorage.setItem('peelBest', best); } catch (e) {} showBest(); }
  const pts = count * 100 - totalGouges * 20, stars = pts >= 450 ? 3 : pts >= 250 ? 2 : pts >= 80 ? 1 : 0;
  $('resTitle').textContent = `ปอกได้ ${count} หัว`;
  $('stars').innerHTML = '★'.repeat(stars) + `<span>${'★'.repeat(3 - stars)}</span>`;
  $('scores').innerHTML = `<span>แหว่งทั้งหมด</span><b>${totalGouges} ที่</b><span>คะแนน</span><b>${Math.max(0, pts)}</b><span>หัวสุดท้ายปอกไป</span><b>${Math.round((1 - skinLeft) * 100)}%</b><span>สถิติ</span><b>${best} หัว</b>`;
  $('result').hidden = false; S.vib([60, 60, 200]);
}
$('again').onclick = start;

/* ================= input ================= */
let mouse = { x: 0, y: 0, down: false, rdrag: null };
addEventListener('mousemove', e => {
  mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight * 2 - 1);
  if (mouse.rdrag) { spin.x += (e.clientX - mouse.rdrag[0]) * .012; spin.y += (e.clientY - mouse.rdrag[1]) * .012; mouse.rdrag = [e.clientX, e.clientY]; }
});
renderer.domElement.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; if (e.button === 2) mouse.rdrag = [e.clientX, e.clientY]; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.rdrag = null; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => { spin.x += e.deltaY * .004; }, { passive: true });
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === ' ' && mode !== 'play') start(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const spin = new THREE.Vector2();   // pending rotation (radians) to apply to the potato

function pointerNdc() {
  if (S.pad.live) {
    // phone: the centre of the turn (after ตั้งศูนย์) points at the potato; ~20° reaches its edge
    const a = S.pad.aim(), c = potGroup.position.clone().project(camera);
    return { x: clamp(c.x + a.yaw / .5, -1, 1), y: clamp(c.y + a.pitch / .38, -1, 1) };
  }
  return { x: mouse.x, y: mouse.y };
}
const peelHeld = () => S.pad.live ? !!S.pad.btn.peel : (mouse.down || !!keys[' ']);

/* ================= loop ================= */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const ray = new THREE.Raycaster();
let last = performance.now(), time = 0, prevHit = null, scrapeT = 0, buzzT = 0, prevRoll = null;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  S.tick(dt);
  if (S.pad.tap('start')) start();

  // rotate the potato: swipe pad, twisting the phone, right-drag / wheel / A D W S keys
  const lk = S.pad.takeLook(); spin.x += lk[0] * .012; spin.y += lk[1] * .012;
  if (S.pad.live) { const r = S.pad.aim().roll; if (prevRoll !== null) spin.x += (r - prevRoll) * 2.2; prevRoll = r; } else prevRoll = null;
  spin.x += ((keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0)) * 2.2 * dt;
  spin.y += ((keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0)) * 1.6 * dt;
  if (potato) {
    const step = spin.clone().multiplyScalar(Math.min(1, dt * 12)); spin.sub(step);
    potato.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), step.x);
    potato.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), step.y);
  }
  popIn = Math.min(1, popIn + dt * 3); potGroup.scale.setScalar(1 - Math.pow(1 - popIn, 3) * 1.0 + Math.sin(popIn * Math.PI) * .12);
  potGroup.position.y = 1.75 + Math.sin(time * 2) * .03;
  potGroup.position.x = Math.sin(time * 70) * .06 * ouchT;
  if (face && face.userData.eyes) {
    for (const e of face.userData.eyes) e.scale.set(1, ouchT > 0 ? .25 : 1, 1);
    face.userData.mouth.rotation.z = ouchT > 0 ? 0 : Math.PI; // frown while it hurts
  }

  // aim the peeler
  const ndc = pointerNdc();
  ray.setFromCamera(new THREE.Vector2(ndc.x, ndc.y), camera);
  const hit = potato && ray.intersectObject(potato, false)[0];
  let target;
  if (hit) {
    const n = hit.face.normal.clone().transformDirection(potato.matrixWorld);
    target = hit.point.clone().addScaledVector(n, .05);
    peeler.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), n.clone().negate()), .3);
  } else {
    target = ray.ray.origin.clone().addScaledVector(ray.ray.direction, camera.position.distanceTo(potGroup.position) - .5);
    peeler.quaternion.slerp(new THREE.Quaternion(), .2);
  }
  const held = peelHeld() && mode === 'play' && !S.pairing();
  peeler.position.lerp(target, .45);
  peeler.scale.setScalar(held ? .95 : 1.05);

  let peeling = false;
  gougeCool -= dt; ouchT = Math.max(0, ouchT - dt);
  if (held && hit && !ruined) {
    // peel along the stroke: paint every few steps between the last contact and this one
    if (prevHit) {
      const d = prevHit.point.distanceTo(hit.point);
      if (d >= 1.2 && gougeCool <= 0) gouge(hit, 'fast'); // a jump this big in one frame is a jerk
      if (d > .01 && d < 1.2) {
        const n = Math.ceil(d / .04), before = skinLeft;
        let over = 0;
        for (let i = 1; i <= n; i++) {
          const uv = prevHit.uv.clone().lerp(hit.uv, i / n);
          if (Math.abs(prevHit.uv.x - hit.uv.x) > .5) { if (i === n) { const r = peelAt(hit.uv, 1); skinLeft -= r.removed; over += r.over; } else over += 1; continue; } // crossing the seam
          const r = peelAt(uv, 1); skinLeft -= r.removed; over += r.over;
        }
        const gained = before - skinLeft;
        if (gained > 0) { peeling = true; if (Math.random() < gained * 40 + .15) dropStrip(hit.point); }
        // mistakes: jerking the peeler, or scraping the same bare spot again and again
        const speed = d / Math.max(dt, 1e-3);
        if (speed > FAST && gougeCool <= 0) gouge(hit, 'fast');
        if (over / n > .85) scrapeAcc += d; else scrapeAcc = Math.max(0, scrapeAcc - d * 2);
        if (scrapeAcc > .6 && !warned) { warned = true; S.toast('ระวัง! ขูดซ้ำตรงที่ปอกแล้ว เดี๋ยวน้องแหว่ง', 1.6); S.vib(30); }
        if (scrapeAcc > 1.3 && gougeCool <= 0) { gouge(hit, 'scrape'); scrapeAcc = 0; warned = false; }
      }
    }
    prevHit = { point: hit.point.clone(), uv: hit.uv.clone() };
  } else prevHit = null;
  if (peeling) {
    scrapeT -= dt; if (scrapeT <= 0) { S.noise(.07, 2600, .12, 'bandpass'); scrapeT = .07; }
    buzzT -= dt; if (buzzT <= 0) { S.vib(12); buzzT = .12; }
  }

  // falling peel strips land in the bowl
  for (const s of strips) {
    const u = s.userData; if (u.landed) continue;
    u.v.y -= 9 * dt; s.position.addScaledVector(u.v, dt);
    s.rotation.x += u.w.x * dt; s.rotation.y += u.w.y * dt;
    const dx = s.position.x - bowl.position.x, dz = s.position.z - bowl.position.z;
    u.v.x += -dx * dt * 2; u.v.z += -dz * dt * 2; // drift toward the bowl
    const floor = Math.hypot(dx, dz) < 1.4 ? .45 : .05;
    if (s.position.y < floor) { s.position.y = floor + rand(0, .15); u.landed = true; }
  }

  if (mode === 'play' && !S.pairing()) {
    timeLeft -= dt;
    const pct = clamp(1 - skinLeft, 0, 1);
    $('pctBar').style.width = Math.min(100, pct / .9 * 100) + '%';
    $('pctTxt').textContent = `ปอกแล้ว ${Math.round(pct * 100)}% · เป้า 90%`;
    $('timeTxt').textContent = Math.max(0, Math.ceil(timeLeft)) + ' วิ';
    $('gougeTxt').textContent = `แหว่ง ${gouges}/${MAX_GOUGE}`; $('gougeTxt').style.color = gouges >= MAX_GOUGE - 1 ? '#d9803a' : '';
    if (pct >= .9 && !ruined) finishPotato();
    if (timeLeft <= 0) endRound();
  }

  const P = S.pad.live;
  if (S.pairing() || !$('result').hidden) S.hint('');
  else if (mode === 'menu') S.hint(P ? 'กดปุ่มเริ่มบนมือถือ หรือกด Space' : 'กด Space เพื่อเริ่ม');
  else if (mode === 'play') S.hint(P ? 'กดค้าง ปอก แล้วลากช้าๆ สม่ำเสมอ · ถ้าสะบัดเร็วหรือขูดซ้ำที่เดิม น้องจะแหว่ง · บิดข้อมือเพื่อหมุน' : 'กดเมาส์ค้างแล้วลากช้าๆ · เร็วไปหรือขูดซ้ำที่เดิมน้องจะแหว่ง · คลิกขวาลาก/A D W S หมุน');
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__peel = { get gouges() { return gouges; }, get total() { return totalGouges; }, feed: d => S.pad.feed(d), start, get mode() { return mode; }, get pct() { return 1 - skinLeft; }, get count() { return count; } };
newPotato(); popIn = 1;
let started = false;
const startWhenReady = setInterval(() => { if (!S.pairing() && !started) { started = true; clearInterval(startWhenReady); start(); } }, 200);
requestAnimationFrame(frame);
</script>
