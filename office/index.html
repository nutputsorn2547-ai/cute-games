<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ออฟฟิศจำลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Mali:wght@400;600&display=swap">
<style>
/* Two views that slide: a computer screen (desktop, folders, apps) and a top-down desk
   (papers, notebook, pencil, pen, eraser, highlighter). A sticky task list sits at the top-left of both. */
:root{--bg:#f4efe6;--card:#ffffff;--ink:#3a3245;--soft:#8c8399;--accent:#7c9cff;--accent-deep:#5a78e6;--good:#5fc28e;--warn:#f2b24a;--line:#e8e1d6;--bad:#ff6b7d;
  --font:"Mitr","Noto Sans Thai",system-ui,sans-serif;--hand:"Mali","Mitr",cursive;color-scheme:light}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 120%,#e9dcc6,#f4efe6 60%)}
.views{position:fixed;inset:0;display:flex;width:200vw;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
.views.desk{transform:translateX(-100vw)}
.view{width:100vw;height:100vh;position:relative;flex:none;overflow:hidden}
/* ---------- monitor ---------- */
.monitor{position:absolute;left:calc(260px + (100vw - 270px) / 2);top:46%;transform:translate(-50%,-50%);width:min(1180px,calc(100vw - 300px));aspect-ratio:16/10;max-height:calc(100vh - 140px);background:#3b3a48;border-radius:26px;padding:16px;box-shadow:0 30px 60px -30px #4a3a2a}
.monitor::after{content:"";position:absolute;left:50%;bottom:-46px;width:160px;height:46px;transform:translateX(-50%);background:linear-gradient(#cfc6b8,#b8ad9c);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);border-radius:0 0 12px 12px}
.screen{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#bfe3ff,#ffd7ec 70%,#ffe9c7);background-size:cover;background-position:center;font-size:14px;transition:background .4s}
.icons{position:absolute;inset:0 0 44px 0}
.icon{position:absolute;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;text-align:center;font-size:12px;line-height:1.25;color:#2e2a38;cursor:default;touch-action:none}
.icon.sel{background:#ffffff88;outline:2px solid #ffffffcc}
.icon span{max-width:88px;word-break:break-word;text-shadow:0 1px 0 #fff,0 0 4px #fff}
.icon.drop{background:#7c9cff55;outline:2px dashed var(--accent-deep)}
.icon input.rn{width:88px;box-sizing:border-box;font:inherit;font-size:12px;text-align:center;border:2px solid var(--accent);border-radius:6px;padding:1px 2px;outline:none}
.dragghost{position:fixed;pointer-events:none;opacity:.85;z-index:60;transform:translate(-50%,-50%) rotate(-4deg)}
.fi{width:42px;height:52px;background:#fff;border-radius:4px 14px 4px 4px;position:relative;box-shadow:0 3px 6px -3px #0006;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box;font:600 10px var(--font);color:#fff}
.fi b{background:var(--c);border-radius:4px;padding:1px 4px}
.fi::before{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,transparent 50%,#0001 50%)}
.th{width:58px;height:46px;border-radius:6px;overflow:hidden;box-shadow:0 3px 6px -3px #0006;border:3px solid #fff;margin-top:4px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.fo{width:54px;height:42px;position:relative;margin-top:8px}
.fo::before{content:"";position:absolute;left:0;top:-7px;width:22px;height:10px;border-radius:4px 4px 0 0;background:var(--c2,#f3b73a)}
.fo::after{content:"";position:absolute;inset:0;border-radius:3px 8px 8px 8px;background:var(--c,#ffcf5a);box-shadow:0 3px 6px -3px #0006}
.fo i{position:absolute;right:-6px;top:-10px;z-index:2;background:var(--bad);color:#fff;font:600 11px var(--font);font-style:normal;border-radius:99px;padding:0 6px;min-width:10px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:#ffffffcc;backdrop-filter:blur(6px);display:flex;align-items:center;gap:4px;padding:0 8px;z-index:99990}
.taskbar button{font:inherit;font-size:13px;border:0;border-radius:10px;background:transparent;padding:6px 9px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.taskbar button.on{background:#fff;box-shadow:0 2px 6px -3px #0005}
.taskbar button .dot{position:absolute;right:2px;top:0;background:#ff5a6e;color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.taskbar .clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--soft)}
.ab{width:18px;height:18px;border-radius:5px;display:inline-block;background:var(--c);color:#fff;font:600 11px/18px var(--font);text-align:center}
/* windows */
.win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 18px 40px -16px #0006;display:flex;flex-direction:column;overflow:hidden;min-width:260px}
.win.max{border-radius:0}
.win .tb{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;background:var(--tc,#eef1ff);font-size:13px;cursor:grab;touch-action:none}
.win .tb .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tb button{font:inherit;border:0;width:24px;height:24px;border-radius:8px;cursor:pointer;line-height:1;flex:none}
.win .tb .x{background:#ff8a9a;color:#fff}
.win .tb .mx{background:#ffffffaa;color:var(--ink);font-size:13px}
.win .body{flex:1;overflow:auto;position:relative}
.win .rz{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;z-index:30;background:linear-gradient(135deg,transparent 52%,#b9b2c9 52% 60%,transparent 60% 70%,#b9b2c9 70% 78%,transparent 78%)}
.win.max .rz{display:none}
.fold{display:flex;flex-wrap:wrap;gap:6px;padding:12px;min-height:100%;box-sizing:border-box;align-content:flex-start}
.fold .icon{position:static}
.fold .empty{color:var(--soft);font-size:13px;margin:auto}
.paper{padding:22px 26px;line-height:1.7;font-size:14px}
.paper h3{margin:0 0 8px;font-weight:600}
.paper table{border-collapse:collapse;width:100%;font-size:13px}
.paper td,.paper th{border-bottom:1px solid #eee;padding:4px 6px;text-align:left}
.paper td:last-child,.paper th:last-child{text-align:right}
.viewer{height:100%;display:flex;flex-direction:column}
.viewer .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#f6f4fa}
.viewer .pic img{max-width:100%;max-height:100%;display:block}
.viewer .acts{flex:none;display:flex;gap:8px;justify-content:center;padding:8px;flex-wrap:wrap}
/* context menu + dialogs + shared buttons */
.ctx{position:absolute;z-index:99999;min-width:200px;background:#fff;border-radius:12px;padding:6px;box-shadow:0 16px 30px -12px #0007;display:flex;flex-direction:column;animation:pop .14s}
.ctx button{font:inherit;font-size:13px;text-align:left;border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;gap:8px;align-items:center}
.ctx button:hover{background:#eef2ff}
.ctx hr{border:0;border-top:1px solid #eee;margin:4px 6px}
.dlg{position:absolute;inset:0;background:#3a324533;display:flex;align-items:center;justify-content:center;z-index:40}
.dlg .dcard{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 16px 30px -12px #0007;min-width:250px;max-width:86%;display:flex;flex-direction:column;gap:10px;font-size:14px}
.dlg input{font:inherit;border:2px solid #e4e0f0;border-radius:10px;padding:6px 10px;outline:none}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn2{font:inherit;font-size:13px;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;background:#eef0f6;color:var(--ink)}
.btn2.pri{background:var(--accent);color:#fff}
.btn2.grn{background:#2fbf5a;color:#fff}
.btn2.org{background:#ff8a3d;color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* wallpaper picker */
.wp{padding:14px;display:flex;flex-direction:column;gap:10px}
.wp .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.wp .g button{aspect-ratio:16/10;border:3px solid #fff;border-radius:10px;cursor:pointer;background-size:cover;background-position:center;box-shadow:0 3px 8px -4px #0006}
.wp .g button.on{border-color:var(--accent-deep)}
.wp h4{margin:4px 0 0;font-weight:500;font-size:13px;color:var(--soft)}
/* spreadsheet */
.xl{display:flex;flex-direction:column;height:100%;font-size:13px}
.xl .xtb{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:5px 6px;border-bottom:1px solid #e3e8e3;background:#f2f8f3}
.xl .xtb button{font:inherit;font-size:12px;border:1px solid #d7e2d8;background:#fff;border-radius:7px;padding:1px 7px;cursor:pointer;min-height:24px;color:var(--ink)}
.xl .xtb button.on{background:#d6efdd;border-color:#2f9d5a}
.xl .xtb button.save{background:#2f9d5a;color:#fff;border-color:#2f9d5a}
.xl .xtb .sw{width:22px;padding:0;background:var(--s);font-size:11px;color:#b9b2c9}
.xl .xtb .sw.ink{background:#fff;color:var(--s);font-weight:700;font-size:13px}
.xl .xtb i{width:1px;height:18px;background:#d7e2d8;margin:0 3px}
.xl .xtb .lbl{font-size:11px;color:var(--soft);margin-left:2px}
.xl .fbar{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid #e3e8e3;background:#f7fbf7}
.xl .fbar b{min-width:46px;text-align:center;background:#fff;border:1px solid #dfe6df;border-radius:6px;padding:2px 4px;font-weight:500}
.xl .fbar span{flex:1;background:#fff;border:1px solid #dfe6df;border-radius:6px;padding:2px 8px;min-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.xl .grid{flex:1;overflow:auto;position:relative}
.xl table{border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.xl th{background:#eef5ee;color:#5f7a62;font-weight:500;font-size:12px;border:1px solid #dde7dd;height:22px;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
.xl th.rh{position:sticky;left:0;z-index:3;cursor:default}
.xl tbody th.rh{z-index:1}
.xl th .cr{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;z-index:4;touch-action:none}
.xl th .cr:hover,.xl th .cr.on{background:#2f9d5a55}
.xl td{border:1px solid #e6ece6;height:24px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;user-select:none}
.xl td.num{text-align:right}
.xl td.inr{box-shadow:inset 0 0 0 999px #2f9d5a1f}
.xl td.sel{outline:2px solid #2f9d5a;outline-offset:-2px}
.xl td.err{color:var(--bad)}
.xl input.ed{position:absolute;box-sizing:border-box;border:2px solid #2f9d5a;font:inherit;padding:0 4px;outline:none;z-index:5}
/* search */
.se{display:flex;flex-direction:column;height:100%}
.se .head{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 16px 0;background:#fff;border-bottom:1px solid #eee}
.se.landing .head{flex:1;justify-content:center;border:0;padding-bottom:30px}
.se.landing .out{display:none}
.se .logo{font:600 24px var(--font);text-align:center;letter-spacing:1px;flex:none}
.se.landing .logo{font-size:46px}
.se .logo i{font-style:normal}
.se .sbar{display:flex;gap:8px;max-width:560px;width:100%;margin:0 auto;flex:none}
.se .sbar input{flex:1;min-width:0;font:inherit;font-size:15px;border:2px solid #e4e0f0;border-radius:99px;padding:7px 16px;outline:none}
.se .sbar input:focus{border-color:var(--accent)}
.se .sbar button{font:inherit;border:0;background:var(--accent);color:#fff;border-radius:99px;padding:7px 18px;cursor:pointer;flex:none}
.se .sbar .cartb{background:#ffe1ec;color:#c23a6b}
.se .tabs{display:flex;gap:2px;justify-content:center;flex:none}
.se .tabs button{font:inherit;font-size:13px;background:none;border:0;color:var(--soft);border-bottom:3px solid transparent;padding:5px 12px;cursor:pointer}
.se .tabs button.on{color:var(--accent-deep);border-color:var(--accent)}
.se .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.se .chips button{font:inherit;font-size:12px;border:1px solid #e4e0f0;background:#fff;border-radius:99px;padding:2px 10px;cursor:pointer;color:var(--ink)}
.se .out{flex:1;overflow:auto;padding:14px 18px;min-height:0}
.res{max-width:680px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.res a{color:#3348b8;font-size:16px;cursor:pointer;text-decoration:none}
.res p{margin:2px 0 0;color:#555;font-size:13px;line-height:1.55}
.res small{color:#3a8a4c;font-size:12px}
.res .note{color:var(--soft);font-size:12px}
.res .wimg{float:right;max-width:160px;border-radius:10px;margin:0 0 8px 12px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ig button{border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#eee;cursor:pointer}
.ig img{width:100%;height:100%;object-fit:cover;display:block}
.iv{display:flex;flex-direction:column;gap:10px;align-items:center}
.iv img{max-width:100%;max-height:250px;border-radius:12px}
.iv .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border:1px solid #eee;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px}
.pc .art{height:84px;border-radius:10px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:42px}
.pc b{font-weight:500;font-size:13px}
.pc .pr{color:#e0457b;font-weight:600}
.pc .st{font-size:11px;color:var(--soft)}
.cartbox{border:2px solid #ffd0e0;border-radius:14px;padding:12px;background:#fff8fb}
.cartbox div{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.hlist{display:flex;flex-direction:column;gap:12px}
.hc{display:flex;gap:12px;border:1px solid #eee;border-radius:14px;padding:10px;cursor:pointer;background:#fff}
.hc:hover{border-color:#c9d4ff}
.hc svg,.hd svg{width:150px;height:96px;border-radius:10px;flex:none}
.hc h4,.hd h3{margin:0 0 2px;font-weight:600;color:#3348b8}
.pr{color:#e0457b;font-weight:600}
.promo{border:2px dashed #ffb0c8;border-radius:14px;padding:10px 14px;background:#fff6fa;cursor:pointer}
.hd{display:flex;flex-direction:column;gap:10px}
.hd svg{width:100%;height:170px}
.hd ul{margin:0;padding-left:1.2em;line-height:1.7;font-size:13px}
/* chat app */
.ch{display:flex;height:100%;font-size:13px}
.ch .side{width:190px;flex:none;background:#f3fbf5;border-right:1px solid #e3efe6;overflow:auto}
.ch .meb{padding:10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #e3efe6}
.ch .it,.pscr .it{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;position:relative}
.ch .it.on,.pscr .it.on{background:#d9f3e1}
.av{width:30px;height:30px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.ch .it small,.pscr .it small{display:block;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
.ch .badge,.pscr .badge{position:absolute;right:8px;top:12px;background:#ff5a6e;color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.ch .conv{flex:1;display:flex;flex-direction:column;min-width:0;background:#d8ecf5}
.ch .ttl{padding:8px 12px;background:#fff;border-bottom:1px solid #e5e5e5;font-weight:500}
.ch .msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:6px;align-items:flex-start;max-width:85%}
.m.mine{align-self:flex-end;flex-direction:row-reverse}
.m .who{font-size:11px;color:#556;margin-bottom:2px}
.m.mine .who{display:none}
.m .bb{background:#fff;border-radius:4px 14px 14px 14px;padding:6px 10px;line-height:1.45;word-break:break-word;display:inline-block}
.m.mine .bb{background:#9ee69f;border-radius:14px 4px 14px 14px}
.m .bb img{max-width:180px;max-height:140px;border-radius:10px;display:block}
.m .fl{display:flex;gap:8px;align-items:center}
.m .hcard{display:flex;flex-direction:column;gap:4px;width:200px}
.m .hcard svg{width:100%;height:80px;border-radius:8px}
.m .lk{display:inline-block;margin:3px 4px 0;background:#fff;border-radius:99px;font-size:11px;padding:0 7px;box-shadow:0 1px 3px #0002;animation:pop .3s}
.m .col{display:flex;flex-direction:column;align-items:flex-start}
.m.mine .col{align-items:flex-end}
.ch .typing{font-size:11px;color:#556;padding:0 12px 4px;min-height:16px}
.ch .comp{display:flex;gap:6px;padding:8px;background:#fff;position:relative}
.ch .comp input{flex:1;min-width:0;font:inherit;border:1px solid #ddd;border-radius:99px;padding:6px 12px;outline:none}
.ch .comp button{font:inherit;border:0;border-radius:99px;padding:6px 12px;cursor:pointer;background:#2fbf5a;color:#fff;flex:none}
.ch .comp .att{background:#eef0f6;color:var(--ink)}
.pick{position:absolute;left:8px;bottom:46px;background:#fff;border-radius:12px;box-shadow:0 12px 24px -10px #0007;max-height:230px;overflow:auto;width:250px;padding:6px;z-index:6}
.pick h5{margin:4px 8px;font-weight:500;color:var(--soft);font-size:11px}
.pick button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;text-align:left;color:var(--ink)}
.pick button:hover{background:#f0f4ff}
.pick .ab{width:22px;height:22px;line-height:22px;font-size:9px}
.signup{margin:auto;width:290px;display:flex;flex-direction:column;gap:8px;text-align:center;padding:16px}
.signup .lg{font:600 30px var(--font);color:#2fbf5a}
.signup input{font:inherit;border:2px solid #e2e8e4;border-radius:10px;padding:7px 10px;outline:none}
.signup input:focus{border-color:#2fbf5a}
.signup .err{color:#e0457b;font-size:12px;min-height:16px}
.chwrap{display:flex;height:100%;background:#f3fbf5}
/* food app */
.fd{display:flex;flex-direction:column;height:100%;font-size:13px;background:#fffaf4}
.fd .top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff0e0;border-bottom:1px solid #f4e2cc}
.fd .top b{font-size:16px;color:#e8742b}
.fd .top .addr{margin-left:auto;font-size:12px;color:#8a6a4a;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .main{flex:1;overflow:auto;padding:12px;min-height:0}
.shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shop{border-radius:14px;background:#fff;border:1px solid #f1e5d6;padding:10px;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.shop .e{font-size:40px;background:var(--c);border-radius:12px;padding:8px 0;margin-bottom:6px}
.shop small{display:block;color:var(--soft)}
.mi{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #f3ece2;background:#fff}
.mi span{flex:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:0;background:#ffe3cc;cursor:pointer;font:inherit;color:#c25a12}
.fd .bot{padding:8px 12px;background:#fff;border-top:1px solid #f1e5d6;display:flex;align-items:center;gap:8px;flex:none}
.fd .go{margin-left:auto;font:inherit;border:0;border-radius:99px;padding:7px 16px;background:#ff8a3d;color:#fff;cursor:pointer}
.fd .go:disabled{background:#ddd;cursor:default}
.map{position:relative;width:100%;aspect-ratio:16/8;border-radius:12px;overflow:hidden;cursor:crosshair;background:#e8f3e0;touch-action:none}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);font-size:30px;pointer-events:none;filter:drop-shadow(0 3px 2px #0005);animation:drop .35s}
@keyframes drop{from{transform:translate(-50%,-190%)}}
.mk{position:absolute;transform:translate(-50%,-50%);font-size:20px;pointer-events:none}
.rider{position:absolute;transform:translate(-50%,-60%);font-size:26px;pointer-events:none;z-index:2}
.steps{display:flex;gap:6px;margin:8px 0}
.steps span{flex:1;text-align:center;padding:4px;border-radius:8px;background:#f3ece2;color:#a08b73;font-size:12px}
.steps span.on{background:#ff8a3d;color:#fff}

const canvases = new Map(); // key -> offscreen canvas holding the marks
let ov = null, nbPage = 0;
const NB_PAGES = 4, nbText = Array(NB_PAGES).fill('');
function overlay(sheetCls, inner, key, isNb) {
  closeOverlay();
  ov = h('div', { class: 'ov' });
  const sheet = h('div', { class: 'sheet ' + sheetCls }, inner);
  const cv = h('canvas'); sheet.append(cv);
  const tools = h('div', { class: 'tools' });
  for (const k of ['pencil', 'pen', 'hl', 'eraser']) { const b = h('button', { 'data-tool': k }, `<span>${TOOLS[k].n}</span>`); tools.append(b); }
  if (isNb) tools.append(h('button', { 'data-tool': 'type' }, '<span>พิมพ์</span><small>คีย์บอร์ด</small>'));
  tools.append(h('hr'));
  if (isNb) { tools.append(h('button', { 'data-act': 'prev' }, '◀ หน้าก่อน')); tools.append(h('button', { 'data-act': 'next' }, 'หน้าถัดไป ▶')); }
  tools.append(h('button', { 'data-act': 'close' }, 'วางคืนโต๊ะ'));
  ov.append(sheet, tools); document.body.append(ov);
  // size canvas to the sheet and restore marks
  const r = sheet.getBoundingClientRect(), dpr = Math.min(devicePixelRatio, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  if (canvases.has(key)) g.drawImage(canvases.get(key), 0, 0, r.width, r.height);
  ov.state = { key, cv, g, sheet, isNb, dpr };
  const ta = sheet.querySelector('textarea');
  if (ta) { ta.value = nbText[nbPage]; ta.addEventListener('input', () => { nbText[nbPage] = ta.value; if (ta.value.trim()) complete('note'); }); }
  tools.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tool) { tool = b.dataset.tool; syncTools(); markInHand(); if (tool === 'type' && ta) ta.focus(); }
    if (b.dataset.act === 'close') closeOverlay();
    if (b.dataset.act === 'prev' || b.dataset.act === 'next') { nbPage = clamp(nbPage + (b.dataset.act === 'next' ? 1 : -1), 0, NB_PAGES - 1); openNotebook(); S.noise(.12, 3000, .06, 'highpass'); }
  });
  syncTools(); S.noise(.15, 2500, .07, 'highpass');
}
function syncTools() {
  if (!ov) return; const st = ov.state;
  ov.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  st.cv.style.pointerEvents = tool === 'type' ? 'none' : 'auto';
  st.cv.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
}
function closeOverlay() {
  if (!ov) return; const st = ov.state;
  // keep marks in an offscreen canvas at css-pixel size
  const keep = document.createElement('canvas'); keep.width = st.cv.width; keep.height = st.cv.height;
  keep.getContext('2d').drawImage(st.cv, 0, 0); canvases.set(st.key, keep);
  ov.remove(); ov = null; if (tool === 'type') tool = 'pen'; markInHand();
}
function openPaper(d) { overlay(d.sticky ? 'stk' : '', `<div class="content">${d.html}</div>`, 'doc:' + d.id, false); }
function openNotebook() { overlay('nbp', `<div class="pg">หน้า ${nbPage + 1}/${NB_PAGES}</div><textarea spellcheck="false" placeholder="เลือก 'พิมพ์' แล้วพิมพ์จากมือถือหรือคีย์บอร์ดได้เลย"></textarea>`, 'nb:' + nbPage, true); }
let stroke = null;
document.addEventListener('pointerdown', e => {
  if (!ov || e.target !== ov.state.cv || tool === 'type') return;
  const st = ov.state, r = st.cv.getBoundingClientRect();
  stroke = { pts: [[e.clientX - r.left, e.clientY - r.top]], snap: st.g.getImageData(0, 0, st.cv.width, st.cv.height), r };
  drawStroke();
});
addEventListener('pointermove', e => { if (!stroke || !ov) return; stroke.pts.push([e.clientX - stroke.r.left, e.clientY - stroke.r.top]); drawStroke(); });
addEventListener('pointerup', () => {
  if (!stroke || !ov) { stroke = null; return; }
  const len = stroke.pts.length; stroke = null;
  if (len > 2) { if (ov.state.isNb && tool !== 'eraser') complete('note'); if (!ov.state.isNb && tool === 'hl') complete('hl'); }
});
function drawStroke() {
  const st = ov.state, g = st.g, t = TOOLS[tool], p = stroke.pts;
  g.putImageData(stroke.snap, 0, 0);
  g.save(); g.lineCap = g.lineJoin = 'round'; g.lineWidth = t.w;
  if (tool === 'eraser') { g.globalCompositeOperation = 'destination-out'; g.strokeStyle = '#000'; }
  else { g.globalCompositeOperation = tool === 'hl' ? 'multiply' : 'source-over'; g.strokeStyle = t.c; g.globalAlpha = t.a; }
  g.beginPath(); g.moveTo(p[0][0], p[0][1]);
  if (p.length === 1) g.lineTo(p[0][0] + .1, p[0][1]);
  for (let i = 1; i < p.length; i++) { const m = [(p[i - 1][0] + p[i][0]) / 2, (p[i - 1][1] + p[i][1]) / 2]; g.quadraticCurveTo(p[i - 1][0], p[i - 1][1], m[0], m[1]); }
  g.stroke(); g.restore();
  if (tool !== 'hl' && tool !== 'eraser' && p.length % 3 === 0) S.noise(.03, tool === 'pencil' ? 4200 : 2600, .025, 'highpass');
}
