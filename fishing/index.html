<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บึงปลาน้อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed pond seen from the dock; catch tally top-left, link chip top-right, tension gauge on the right edge, hint pill bottom-centre */
:root{--bg:#e7f6f3;--card:#ffffff;--ink:#3c4a52;--soft:#7f939c;--pink:#ff8fab;--pink-deep:#e8678a;--mint:#7fd8be;--sky:#8fd3e8;--line:#d7ebe7;--warn:#f0a33a;
  --font:"Mitr","Noto Sans Thai",system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:24px;top:18px;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-variant-numeric:tabular-nums}
.hud .lbl{font-size:13px;color:var(--soft)}
.hud b{font-size:40px;font-weight:600;line-height:1}
.logbtn{position:fixed;left:24px;top:112px;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip{position:fixed;right:20px;top:18px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 6px 18px -10px #7fb3aa}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--mint)}
.chip button{font:inherit;font-size:13px;border:0;background:var(--line);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.gauge{position:fixed;right:28px;top:50%;transform:translateY(-50%);width:26px;height:46vh;border-radius:13px;background:var(--card);border:2px solid var(--line);overflow:hidden;box-shadow:0 10px 30px -18px #3c4a52}
.gauge i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--mint);transition:height .08s linear}
.gauge i.warn{background:var(--warn)}.gauge i.hot{background:var(--pink-deep)}
.gauge .drag{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.35}
.gauge-lbl{position:fixed;right:14px;top:calc(50% + 24vh + 8px);width:54px;text-align:center;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:16px;box-shadow:0 8px 24px -12px #7fb3aa;max-width:calc(100vw - 48px);text-align:center;pointer-events:none}
.big-msg{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);font-size:44px;font-weight:600;color:var(--ink);text-shadow:0 3px 0 #fff;pointer-events:none;white-space:nowrap}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 65%,transparent)}
.card{background:var(--card);border-radius:28px;padding:28px 30px;display:flex;gap:28px;align-items:center;max-width:720px;box-shadow:0 30px 60px -30px #4f7f78;border:1px solid var(--line)}
.card h1{margin:0 0 6px;font-size:32px;font-weight:600}
.card p{margin:0 0 12px;color:var(--soft);line-height:1.6}
.card ol{margin:0 0 16px;padding-left:1.2em;line-height:1.75}
.qr{flex:none;width:200px;height:200px;border-radius:16px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.qr svg{width:100%;height:100%}
.code{font-size:28px;font-weight:600;letter-spacing:.25em;color:var(--pink-deep)}
.btn{font:inherit;font-size:16px;font-weight:500;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--pink);color:#fff}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn:focus-visible,.chip button:focus-visible,.logbtn:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.catch{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border-radius:24px;padding:16px 26px;text-align:center;border:1px solid var(--line);box-shadow:0 20px 40px -20px #4f7f78}
.catch h2{margin:0;font-size:26px;font-weight:600}
.catch p{margin:4px 0 0;color:var(--soft)}
.new{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;font-size:13px;padding:2px 10px;margin-left:6px;vertical-align:4px}
.log{flex-direction:column;align-items:stretch;gap:14px;min-width:min(560px,90vw)}
.log ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.log li{border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.log li b{font-weight:500}.log li span{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.log li.unknown b{color:var(--soft)}
@media (max-width:640px){.card{flex-direction:column;text-align:center}.card ol{text-align:left}}
</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.js" } }</script>
</head>
<body>
<div class="hud"><span class="lbl">จับได้</span><b id="count">0</b><span class="lbl" id="total">รวม 0.00 กก.</span></div>
<button class="logbtn" id="logBtn">สมุดปลา</button>
<div class="chip"><span class="dot" id="dot"></span><span id="chipText">กำลังเปิดห้อง…</span><button id="showPair">ต่อมือถือ</button></div>
<div class="gauge" id="gauge" hidden><div class="drag" id="dragMark"></div><i id="gfill"></i></div>
<div class="gauge-lbl" id="glbl" hidden></div>
<div class="big-msg" id="bigMsg" hidden></div>
<div class="hint" id="hint" hidden></div>
<div class="catch" id="catch" hidden><h2 id="catchName"></h2><p id="catchInfo"></p></div>

<div class="overlay" id="pair" hidden>
  <div class="card">
    <div class="qr" id="qr">…</div>
    <div>
      <h1>บึงปลาน้อย</h1>
      <p>มือถือคือคันเบ็ด เหวี่ยง ตวัด แล้วสู้กับแรงดึงของปลาจนกว่ามันจะหมดแรง</p>
      <ol>
        <li>สแกน QR หรือเปิด <b>pad.html</b> ใส่รหัส <span class="code" id="code">·····</span></li>
        <li>ถือหงายจอ หัวเครื่องชี้จอ กด <b>ตั้งศูนย์</b></li>
        <li>เงยขึ้นแล้วสะบัดลงเพื่อเหวี่ยง ปลากินเมื่อไหร่กระตุกขึ้น แล้วหมุนรอก</li>
      </ol>
      <button class="btn ghost" id="mousePlay">เล่นด้วยเมาส์ก่อน</button>
    </div>
  </div>
</div>

<div class="overlay" id="logPanel" hidden>
  <div class="card log">
    <h1 style="margin:0">สมุดปลา</h1>
    <ul id="logList"></ul>
    <button class="btn" id="logClose" style="align-self:flex-end">ปิด</button>
  </div>
</div>

<script src="../lib/qrcode.js"></script>
<script type="module">
import * as THREE from 'three';
import { hostRoom } from '../lib/link.js?v=3';
import { VMouse, fullscreenButton } from '../lib/vmouse.js?v=1';
import { pointerAngles, bestForwardAxis, wrap, OneEuro } from '../lib/aim.js?v=2';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

/* ================= tuning ================= */
const LAKE = { x: 0, z: -18, r: 30 };
const ROD_LEN = 3.8;
const LINE_K = 42;          // N per metre of stretch (line + rod flex)
const BREAK = 36;           // N — line snaps above this for a moment
const DRAG = 27;            // N — reel drag starts paying out line here
const SPOOL = 0.13;         // metres of line per radian of reel turn
const SPECIES = [
  { id: 'gold',    name: 'ปลาทองตาโต',     color: '#ff9f43', belly: '#ffe0b3', w: [0.25, 0.9], power: 8,  speed: 2.2, size: .55, rare: 30, jump: 0 },
  { id: 'tilapia', name: 'ปลานิลยิ้มหวาน',  color: '#7f9cc9', belly: '#e3ebf8', w: [0.6, 2.0],  power: 12, speed: 2.6, size: .75, rare: 28, jump: .08 },
  { id: 'cat',     name: 'ปลาดุกหนวดฟู',    color: '#9b7b6a', belly: '#e2d2c6', w: [1.0, 3.6],  power: 17, speed: 2.3, size: .95, rare: 18, jump: 0, whisker: true },
  { id: 'koi',     name: 'ปลาคาร์ปซากุระ',  color: '#fff8f5', belly: '#ffe3ea', spots: '#ff6b81', w: [1.5, 5.0], power: 20, speed: 2.7, size: 1.05, rare: 12, jump: .05 },
  { id: 'snake',   name: 'ปลาช่อนจอมซ่า',   color: '#6b7f5a', belly: '#d5e0c4', w: [2.0, 5.5],  power: 25, speed: 3.3, size: 1.15, rare: 9, jump: .3 },
  { id: 'whale',   name: 'วาฬน้อยในบึง',    color: '#79c8f2', belly: '#e6f6ff', w: [8, 12],     power: 33, speed: 2.1, size: 1.6, rare: 3, jump: .15 },
];

/* ================= renderer & scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#9fdcf0'); gr.addColorStop(.6, '#dff4f7'); gr.addColorStop(1, '#fff1e6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.fog = new THREE.Fog('#dff4f7', 45, 110);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
camera.position.set(0, 3.3, 6.2);
scene.add(new THREE.HemisphereLight('#ffffff', '#9fc9b8', 1.5));
const sun = new THREE.DirectionalLight('#fff4e0', 2.0);
sun.position.set(-14, 22, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -30, near: 1, far: 80 }); sun.shadow.bias = -0.0005;
scene.add(sun);

// water
const waterGeo = new THREE.PlaneGeometry(64, 64, 64, 64);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color: '#7cc9dc', roughness: .18, metalness: .08, transparent: true, opacity: .84 }));
water.rotation.x = -Math.PI / 2; water.position.set(LAKE.x, 0, LAKE.z); water.receiveShadow = true; scene.add(water);
const bed = new THREE.Mesh(new THREE.CircleGeometry(31, 64), new THREE.MeshStandardMaterial({ color: '#4f9fae', roughness: 1 }));
bed.rotation.x = -Math.PI / 2; bed.position.set(LAKE.x, -2.2, LAKE.z); scene.add(bed);
const waterY = (x, z, t) => 0.05 * Math.sin(x * 0.45 + t * 1.1) + 0.04 * Math.cos(z * 0.6 + t * 1.4);
function animateWater(t) {
  const p = waterGeo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, waterY(x + LAKE.x, -y + LAKE.z, t)); }
  p.needsUpdate = true; waterGeo.computeVertexNormals();
}
// shore
const grassMat = new THREE.MeshStandardMaterial({ color: '#9fdc9a', roughness: 1 });
const shore = new THREE.Mesh(new THREE.RingGeometry(LAKE.r, 160, 96, 1), grassMat);
shore.rotation.x = -Math.PI / 2; shore.position.set(LAKE.x, 0.12, LAKE.z); shore.receiveShadow = true; scene.add(shore);
const sand = new THREE.Mesh(new THREE.RingGeometry(LAKE.r - 0.6, LAKE.r + 1.2, 96, 1), new THREE.MeshStandardMaterial({ color: '#f3e3c3', roughness: 1 }));
sand.rotation.x = -Math.PI / 2; sand.position.set(LAKE.x, 0.1, LAKE.z); scene.add(sand);
// trees
function tree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18 * s, .25 * s, 1.4 * s, 8), new THREE.MeshStandardMaterial({ color: '#b98b6e' }));
  trunk.position.y = .7 * s; trunk.castShadow = true;
  const col = ['#7fd38a', '#9be29b', '#ffb7c9', '#8fd8b5'][Math.floor(Math.random() * 4)];
  const top = new THREE.Mesh(new THREE.SphereGeometry(1.1 * s, 20, 16), new THREE.MeshStandardMaterial({ color: col, roughness: .9 }));
  top.position.y = 2 * s; top.castShadow = true;
  g.add(trunk, top); g.position.set(x, 0.1, z); scene.add(g);
}
for (let i = 0; i < 34; i++) {
  const a = rand(-0.2, Math.PI + 0.2) + Math.PI, r = LAKE.r + rand(3, 14);
  const x = LAKE.x + Math.cos(a) * r, z = LAKE.z + Math.sin(a) * r;
  tree(x, z, rand(1, 2.2));
}
// lily pads + lotus
const padMat = new THREE.MeshStandardMaterial({ color: '#6cc26f', roughness: .8, side: THREE.DoubleSide });
const lilies = [];
for (let i = 0; i < 26; i++) {
  const a = rand(0, Math.PI * 2), r = rand(LAKE.r * .55, LAKE.r - 2);
  const x = LAKE.x + Math.cos(a) * r, z = LAKE.z + Math.sin(a) * r;
  if (z > 0) continue;
  const pad = new THREE.Mesh(new THREE.CircleGeometry(rand(.45, .9), 24, .3, Math.PI * 1.8), padMat);
  pad.rotation.x = -Math.PI / 2; pad.rotation.z = rand(0, 6); pad.position.set(x, .03, z); scene.add(pad); lilies.push(pad);
  if (Math.random() < .35) {
    const f = new THREE.Mesh(new THREE.ConeGeometry(.22, .3, 6), new THREE.MeshStandardMaterial({ color: '#ffb3c8' }));
    f.position.set(x + .1, .18, z); pad.userData.flower = f; scene.add(f);
  }
}
// clouds
const clouds = [];
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1 });
  for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(rand(1.6, 2.6), 16, 12), m); s.position.set(j * 2 - 3, rand(-.4, .4), rand(-.5, .5)); g.add(s); }
  g.position.set(rand(-60, 60), rand(18, 28), rand(-90, -60)); scene.add(g); clouds.push(g);
}
// dock
{
  const wood = new THREE.MeshStandardMaterial({ color: '#d9a77f', roughness: .9 });
  for (let i = 0; i < 9; i++) {
    const plank = new THREE.Mesh(new THREE.BoxGeometry(2.6, .14, .62), wood);
    plank.position.set(0, .55, 8.5 - i * .68); plank.castShadow = true; plank.receiveShadow = true; scene.add(plank);
  }
  for (const x of [-1.2, 1.2]) for (const z of [8.2, 5.2, 3.0]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, 1.8, 10), wood); post.position.set(x, -.2, z); scene.add(post);
  }
}

/* ================= cute fish mesh ================= */
function makeFish(sp) {
  const g = new THREE.Group(), s = sp.size;
  const bodyMat = new THREE.MeshStandardMaterial({ color: sp.color, roughness: .5 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(.5, 28, 20), bodyMat); body.scale.set(1.25 * s, .78 * s, .55 * s); body.castShadow = true;
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.5, 24, 16), new THREE.MeshStandardMaterial({ color: sp.belly, roughness: .6 }));
  belly.scale.set(1.05 * s, .55 * s, .5 * s); belly.position.y = -.13 * s;
  const tail = new THREE.Mesh(new THREE.ConeGeometry(.32 * s, .55 * s, 4), bodyMat); tail.rotation.z = Math.PI / 2; tail.scale.z = .3; tail.position.x = -.78 * s;
  const fin = new THREE.Mesh(new THREE.ConeGeometry(.16 * s, .35 * s, 4), bodyMat); fin.position.set(-.05 * s, .42 * s, 0); fin.scale.z = .3; fin.rotation.z = -.4;
  g.add(body, belly, tail, fin);
  const eyeW = new THREE.MeshBasicMaterial({ color: '#ffffff' }), eyeB = new THREE.MeshBasicMaterial({ color: '#2d2a32' }), blush = new THREE.MeshBasicMaterial({ color: '#ff9fb5' });
  for (const z of [1, -1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(.11 * s, 14, 10), eyeW); w.position.set(.36 * s, .1 * s, z * .22 * s);
    const b = new THREE.Mesh(new THREE.SphereGeometry(.065 * s, 12, 10), eyeB); b.position.set(.42 * s, .11 * s, z * .27 * s);
    const bl = new THREE.Mesh(new THREE.CircleGeometry(.06 * s, 12), blush); bl.position.set(.38 * s, -.05 * s, z * .27 * s); bl.rotation.y = z > 0 ? 0 : Math.PI;
    g.add(w, b, bl);
  }
  if (sp.spots) for (let i = 0; i < 4; i++) {
    const sp2 = new THREE.Mesh(new THREE.SphereGeometry(.13 * s, 12, 8), new THREE.MeshStandardMaterial({ color: sp.spots })); sp2.scale.set(1, .5, .9);
    sp2.position.set(rand(-.3, .2) * s, rand(.15, .3) * s, rand(-.1, .1) * s); g.add(sp2);
  }
  if (sp.whisker) for (const z of [1, -1]) {
    const wsk = new THREE.Mesh(new THREE.CylinderGeometry(.012 * s, .012 * s, .5 * s, 4), eyeB); wsk.rotation.z = 1.1; wsk.position.set(.65 * s, -.12 * s, z * .12 * s); g.add(wsk);
  }
  g.userData.tail = tail;
  return g;
}

/* ================= rod, line, bobber ================= */
const rodMat = new THREE.MeshStandardMaterial({ color: '#ff8fab', roughness: .4 });
let rodMesh = null;
const handle = new THREE.Mesh(new THREE.CylinderGeometry(.07, .08, .7, 10), new THREE.MeshStandardMaterial({ color: '#7a5c4f' }));
const reelMesh = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .1, 16), new THREE.MeshStandardMaterial({ color: '#ffd166', metalness: .3, roughness: .4 }));
scene.add(handle, reelMesh);
const ROD_BASE = new THREE.Vector3(0.75, 1.75, 4.4);
const lineGeo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 30 }, () => new THREE.Vector3()));
const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: .9 }));
line.frustumCulled = false; scene.add(line);
const bobber = new THREE.Group();
{
  const top = new THREE.Mesh(new THREE.SphereGeometry(.13, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#ff5d7a' }));
  const bot = new THREE.Mesh(new THREE.SphereGeometry(.13, 16, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#ffffff' }));
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .22, 6), new THREE.MeshStandardMaterial({ color: '#ff5d7a' })); stick.position.y = .2;
  bobber.add(top, bot, stick);
}
scene.add(bobber);
// ripples & splashes
const ripples = [];
function ripple(x, z, size = 1) {
  const m = new THREE.Mesh(new THREE.RingGeometry(.2, .28, 32), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: .8, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, .06, z); m.userData = { life: 1, size }; scene.add(m); ripples.push(m);
}
const drops = [];
const dropGeo = new THREE.SphereGeometry(.05, 6, 4), dropMat = new THREE.MeshBasicMaterial({ color: '#e8fbff' });
function splash(x, z, n = 14, power = 1) {
  for (let i = 0; i < n; i++) {
    const d = new THREE.Mesh(dropGeo, dropMat); d.position.set(x, .05, z);
    const a = rand(0, 6.28), s = rand(.6, 1.6) * power;
    d.userData = { v: new THREE.Vector3(Math.cos(a) * s, rand(2, 4) * power, Math.sin(a) * s) };
    scene.add(d); drops.push(d);
  }
  ripple(x, z, power);
}

// wandering fish shadows
const shadows = [];
for (let i = 0; i < 7; i++) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(.5, 20), new THREE.MeshBasicMaterial({ color: '#2b5f6b', transparent: true, opacity: .32, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.scale.set(rand(1.4, 2.2), rand(.6, .9), 1);
  const a = rand(0, 6.28), r = rand(4, LAKE.r - 6);
  m.position.set(LAKE.x + Math.cos(a) * r, -.12, LAKE.z + Math.sin(a) * r);
  m.userData = { target: null, speed: rand(.6, 1.2) };
  scene.add(m); shadows.push(m);
}
function newWaypoint() { const a = rand(0, 6.28), r = rand(3, LAKE.r - 5); return new THREE.Vector3(LAKE.x + Math.cos(a) * r, -.12, LAKE.z + Math.sin(a) * r); }

/* ================= input: phone + mouse + keys ================= */
let qT = [1, 0, 0, 0], lastPad = -1e9, cal = null, padTaps = {}, padBtn = {}, needCal = false, padReel = null;
let fwdAxis = [0, 1, 0], aimF = { yaw: 0, pitch: 0 }, yawU = 0, prevYawRaw = null, rawPitch = 0;
const fYaw = new OneEuro(.6, 1.6), fPitch = new OneEuro(.6, 1.6);
const pitchHist = [], flickHist = [];
let flickDown = 0, flickUp = false, lastFlick = 0;
let usingMouse = false, keys = {}, reelAcc = 0, strikeEvt = false, castHeld = false;
const phoneLive = () => performance.now() - lastPad < 1500;
function filterAim(dt, reset) {
  const a = pointerAngles(qT, fwdAxis);

  for (let i = ripples.length - 1; i >= 0; i--) if (ripples[i].userData.life <= 0) { scene.remove(ripples[i]); ripples[i].geometry.dispose(); ripples.splice(i, 1); }
  for (const d of drops) { d.userData.v.y -= 9.8 * dt; d.position.addScaledVector(d.userData.v, dt); }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].position.y < -.1) { scene.remove(drops[i]); drops.splice(i, 1); }
  for (const c of clouds) { c.position.x += dt * .6; if (c.position.x > 70) c.position.x = -70; }
  for (const l of lilies) { l.position.y = waterY(l.position.x, l.position.z, time) + .03; if (l.userData.flower) l.userData.flower.position.y = l.position.y + .15; }

  look.lerp(new THREE.Vector3(focus.x * .6, 0, Math.min(-4, focus.z * .7)), dt * 1.5);
  camera.lookAt(look);

  // UI
  const showG = state === 'fight';
  $('gauge').hidden = !showG; $('glbl').hidden = !showG;
  if (showG) {
    const tn = tension / BREAK;
    $('gfill').style.height = Math.min(100, tn * 100) + '%';
    $('gfill').className = tn > .85 ? 'hot' : tn > .6 ? 'warn' : '';
    $('dragMark').style.bottom = (DRAG / BREAK * 100) + '%';
    $('glbl').textContent = `${lineLen.toFixed(1)} ม.`;
  }
  const P = phoneLive();
  if (!$('pair').hidden) hint('');
  else if (state === 'ready') hint(P ? 'เงยมือถือขึ้น แล้วสะบัดลงเร็วๆ เพื่อเหวี่ยงเบ็ด (หรือกดค้างปุ่มเหวี่ยง)' : 'กด Space ค้างเพื่อเพิ่มแรง ปล่อยเพื่อเหวี่ยง · เมาส์ซ้ายขวาเล็งทิศ');
  else if (state === 'charging') hint(`แรงเหวี่ยง ${Math.round(castPower * 100)}% · ปล่อยเพื่อเหวี่ยง`);
  else if (state === 'wait') hint(bite.phase === 'bite' ? (P ? 'กินแล้ว! กระตุกขึ้นเร็วๆ!' : 'กินแล้ว! คลิกเลย!') : bite.phase === 'nibble' ? 'ปลากำลังตอด… รอให้ทุ่นจมก่อน' : (P ? 'รอปลากินเหยื่อ · หมุนรอกเพื่อเก็บสาย' : 'รอปลากินเหยื่อ · ลูกกลิ้งเมาส์/ปุ่ม R เก็บสาย'));
  else if (state === 'fight') {
    const tn = tension / BREAK;
    hint(tn > .85 ? 'สายจะขาด! หยุดกรอ ลดคันลง' : tn < .05 ? 'สายหย่อน! กรอรอกเร็วๆ' : (P ? 'หมุนรอก · เงยคันดึง แล้วก้มคันพร้อมกรอ · หันคันสวนทางที่ปลาวิ่ง' : 'ลูกกลิ้ง/R กรอ · W/S ยกคัน · A/D หันคันสวนปลา'));
  } else if (state === 'landing') hint(landing.t > 2 ? (P ? 'กดตวัดเพื่อตกต่อ' : 'คลิกเพื่อตกต่อ') : '');
  else hint('');

  renderer.render(scene, camera);
  fpsN++; if (now - fpsT > 1000) { fps = fpsN; fpsN = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
let fpsN = 0, fpsT = performance.now(), fps = 0;

$('pair').hidden = false;
requestAnimationFrame(frame);
</script>
